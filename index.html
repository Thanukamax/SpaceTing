    // ----------------------------------------------------
    // 2. AUDIO SYNTHESIZER: ERIK SATIE / INTERSTELLAR ENGINE
    // ----------------------------------------------------
    class CosmicAudioEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.timer = null;
        this.droneOsc1 = null;
        this.droneOsc2 = null;
        this.droneGain = null;
        this.reverbNode = null;
        this.masterGain = null;

        // C# minor / F# minor poignant notes (Erik Satie / Interstellar mood)
        this.chords = [
          // Voicing 1: C# minor add9
          [138.59, 207.65, 277.18, 329.63, 622.25], // C#3, G#3, C#4, E4, D#5
          // Voicing 2: F# minor 9
          [185.00, 277.18, 369.99, 440.00, 554.37], // F#3, C#4, F#4, A4, C#5
          // Voicing 3: A major 7 (#11)
          [220.00, 277.18, 329.63, 415.30, 493.88], // A3, C#4, E4, G#4, B4
          // Voicing 4: B suspended / Solitude
          [123.47, 185.00, 277.18, 369.99, 493.88], // B2, F#3, C#4, F#4, B4
          // Voicing 5: High lonely starlight
          [277.18, 415.30, 622.25, 659.25, 830.61]  // C#4, G#4, D#5, E5, G#5
        ];
      }

      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        // Master Compressor & Limiter to prevent clipping
        const compressor = this.ctx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-20, this.ctx.currentTime);
        compressor.knee.setValueAtTime(30, this.ctx.currentTime);
        compressor.ratio.setValueAtTime(8, this.ctx.currentTime);
        compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
        compressor.release.setValueAtTime(0.25, this.ctx.currentTime);

        // Master Lowpass Filter for vintage warm analog tone
        const masterFilter = this.ctx.createBiquadFilter();
        masterFilter.type = 'lowpass';
        masterFilter.frequency.setValueAtTime(3200, this.ctx.currentTime);

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.7, this.ctx.currentTime);

        // Build Algorithmic Reverb Impulse (4.5s decay)
        this.reverbNode = this.ctx.createConvolver();
        this.reverbNode.buffer = this.createImpulseResponse(4.5, 2.2);

        // Connect master graph
        this.reverbNode.connect(masterFilter);
        masterFilter.connect(compressor);
        compressor.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);
      }

      createImpulseResponse(duration, decay) {
        const rate = this.ctx.sampleRate;
        const length = rate * duration;
        const impulse = this.ctx.createBuffer(2, length, rate);
        const left = impulse.getChannelData(0);
        const right = impulse.getChannelData(1);

        for (let i = 0; i < length; i++) {
          const t = i / length;
          const factor = Math.pow(1 - t, decay);
          left[i] = (Math.random() * 2 - 1) * factor;
          right[i] = (Math.random() * 2 - 1) * factor;
        }
        return impulse;
      }

      startDrone() {
        if (!this.ctx) return;

        // Tape Warmth Sub-Drone at 69.3 Hz (C#2) and 103.8 Hz (G#2)
        this.droneOsc1 = this.ctx.createOscillator();
        this.droneOsc2 = this.ctx.createOscillator();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();

        this.droneOsc1.type = 'sine';
        this.droneOsc1.frequency.setValueAtTime(69.3, this.ctx.currentTime);

        this.droneOsc2.type = 'triangle';
        this.droneOsc2.frequency.setValueAtTime(103.8, this.ctx.currentTime);

        // Slow pitch wow & flutter LFO
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(0.12, this.ctx.currentTime);
        lfoGain.gain.setValueAtTime(0.8, this.ctx.currentTime);
        lfo.connect(this.droneOsc1.frequency);
        lfo.start();

        const droneFilter = this.ctx.createBiquadFilter();
        droneFilter.type = 'lowpass';
        droneFilter.frequency.setValueAtTime(160, this.ctx.currentTime);

        this.droneGain = this.ctx.createGain();
        this.droneGain.gain.setValueAtTime(0.001, this.ctx.currentTime);
        // Gentle fade in
        this.droneGain.gain.exponentialRampToValueAtTime(0.18, this.ctx.currentTime + 3.0);

        this.droneOsc1.connect(droneFilter);
        this.droneOsc2.connect(droneFilter);
        droneFilter.connect(this.droneGain);
        this.droneGain.connect(this.reverbNode);

        this.droneOsc1.start();
        this.droneOsc2.start();
      }

      playPianoNote(freq, delaySeconds = 0) {
        if (!this.ctx || !this.isPlaying) return;

        const now = this.ctx.currentTime + delaySeconds;

        // 1. Fundamental oscillator (triangular warmth)
        const osc1 = this.ctx.createOscillator();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, now);

        // 2. Second harmonic (sine purity)
        const osc2 = this.ctx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(freq * 2.001, now);

        // 3. Hammer felt attack impulse (gentle click)
        const noise = this.ctx.createBufferSource();
        const noiseBuffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.015, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < noiseBuffer.length; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.exp(-i / 150);
        }
        noise.buffer = noiseBuffer;

        const noiseFilter = this.ctx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.setValueAtTime(freq * 1.5, now);
        noiseFilter.Q.setValueAtTime(3.0, now);
        noise.connect(noiseFilter);

        // Note Filter Envelope
        const noteFilter = this.ctx.createBiquadFilter();
        noteFilter.type = 'lowpass';
        noteFilter.frequency.setValueAtTime(freq * 4.5, now);
        noteFilter.frequency.exponentialRampToValueAtTime(freq * 0.8, now + 3.5);

        // Note Gain Envelope
        const noteGain = this.ctx.createGain();
        noteGain.gain.setValueAtTime(0.0001, now);
        // Hammer strike
        noteGain.gain.linearRampToValueAtTime(0.24, now + 0.008);
        // Long exponential decay (Satie style)
        noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 4.8);

        // Stereo Panning for wide celestial soundstage
        const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
        if (panner) {
          const pan = (Math.sin(freq * 0.05) * 0.45);
          panner.pan.setValueAtTime(pan, now);
        }

        // Connect graph
        osc1.connect(noteFilter);
        osc2.connect(noteFilter);
        noiseFilter.connect(noteGain);

        noteFilter.connect(noteGain);

        if (panner) {
          noteGain.connect(panner);
          panner.connect(this.reverbNode);
          panner.connect(this.masterGain);
        } else {
          noteGain.connect(this.reverbNode);
          noteGain.connect(this.masterGain);
        }

        osc1.start(now);
        osc2.start(now);
        noise.start(now);

        osc1.stop(now + 5.0);
        osc2.stop(now + 5.0);
        noise.stop(now + 0.05);
      }

      playSatieStep() {
        if (!this.isPlaying) return;

        // Choose a chord voicing

        const style = Math.random();

          // Solitary lonely note
          const note = chord[Math.floor(Math.random() * chord.length)];
          this.playPianoNote(note, 0);
        } else if (style < 0.8) {
          // Gentle dyad (bass note + starlight high note)
          const bass = chord[0];
          const treble = chord[2 + Math.floor(Math.random() * (chord.length - 2))];
          this.playPianoNote(bass, 0);
          this.playPianoNote(treble, 0.45 + Math.random() * 0.4);

          this.playPianoNote(chord[3] || chord[2], 1.4 + Math.random() * 0.4);
        }

        // Schedule next note between 4.2 and 6.8 seconds
        const nextInterval = 4200 + Math.random() * 2600;
        this.timer = setTimeout(() => {
          this.playSatieStep();
        }, nextInterval);
      }

      playClickChime() {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1760, now);
          osc.frequency.exponentialRampToValueAtTime(2640, now + 0.04);
          
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
          
          osc.connect(gain);
          gain.connect(this.masterGain || this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch (e) {
          // Audio context might be suspended
        }
      }

      toggle() {
        this.init();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        this.isPlaying = !this.isPlaying;

        if (this.isPlaying) {
          this.startDrone();
          this.playSatieStep();
        } else {
          if (this.timer) clearTimeout(this.timer);

            }, 1300);
          }
        }
        return this.isPlaying;
      }
    }

    // Responsive camera Z distance calculation ensuring NOVA & galaxy are framed without edge clipping on mobile portrait
    function getResponsiveCamZ() {
      const aspect = (camera && camera.aspect) ? camera.aspect : (window.innerWidth / window.innerHeight);
      if (aspect >= 1.25) return 44.0;
      
      const tanHalfFov = 0.4244748; // tan(degToRad(23))
      let desiredWidth;
      if (aspect <= 0.6) {
        desiredWidth = 31.0;
      } else {
        const t = (aspect - 0.6) / (1.25 - 0.6);
        desiredWidth = THREE.MathUtils.lerp(31.0, 55.0, t);
      }
      const reqZ = desiredWidth / (2.0 * tanHalfFov * aspect);
      return THREE.MathUtils.clamp(reqZ, 44.0, 84.0);
    }

    // Generates 3D coordinates forming the word "NOVA" in Apple system typography (SF Pro Display)
    function generateNovaTargets(count) {
      const canvas = document.createElement('canvas');
      const W = 1600;
      const H = 600;
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      if (!ctx) return null;

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      // Heavy, elegant Apple system typography (SF Pro Display / SF Pro / Helvetica Neue)
      ctx.font = '900 250px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", Inter, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      try {
        ctx.letterSpacing = '18px';
      } catch (e) {}
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('NOVA', W / 2, H / 2);

      const imgData = ctx.getImageData(0, 0, W, H);
      const data = imgData.data;

      const candidates = [];
      let minX = W, maxX = 0, minY = H, maxY = 0;

      for (let y = 0; y < H; y += 2) {
        for (let x = 0; x < W; x += 2) {
          const idx = (y * W + x) * 4;
          const brightness = data[idx]; // Red channel
          if (brightness > 45) {
            candidates.push({ x, y, b: brightness / 255.0 });
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const targets = new Float32Array(count * 3);
      if (candidates.length === 0) {
        for (let i = 0; i < count * 3; i++) targets[i] = 0;
        return targets;
      }

      const textWidth = Math.max(maxX - minX, 1);
      const centerX = (minX + maxX) / 2.0;
      const centerY = (minY + maxY) / 2.0;
      const isMobile = window.innerWidth < 640;
      const isTablet = window.innerWidth < 1024;
      const targetWidth3D = isMobile ? 22.0 : (isTablet ? 27.0 : 32.0);
      const scale = targetWidth3D / textWidth;

      // 88% of stars form the razor-sharp letters
      const textStars = Math.floor(count * 0.88);
      const step = candidates.length / textStars;

      const jitterPos = isMobile ? 0.16 : 0.24;
      const jitterZ = isMobile ? 1.0 : 1.4;

      for (let i = 0; i < textStars; i++) {
        const idx = Math.floor(i * step) % candidates.length;
        const pt = candidates[idx];

        // Micro-jitter gives letters crystalline star-density volume
        const jx = (Math.random() - 0.5) * jitterPos;
        const jy = (Math.random() - 0.5) * jitterPos;
        const jz = (Math.random() - 0.5) * jitterZ;

        targets[i * 3 + 0] = (pt.x - centerX) * scale + jx;
        targets[i * 3 + 1] = -(pt.y - centerY) * scale + jy;
        targets[i * 3 + 2] = jz;
      }

      // Remaining 12% form a diffuse ethereal constellation halo around NOVA
      const haloSpread = isMobile ? 15.0 : 22.0;
      for (let i = textStars; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const rad = 2.5 + Math.pow(Math.random(), 1.5) * haloSpread;
        targets[i * 3 + 0] = Math.cos(angle) * rad * 1.15;
        targets[i * 3 + 1] = Math.sin(angle) * rad * 0.45;
        targets[i * 3 + 2] = (Math.random() - 0.5) * 3.5;
      }

      return targets;
    }

    // Generates high-resolution procedural mineral micro-textures for the 3D sand grain
    function generateSandTextures() {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Gritty quartz stone base gradient
      const baseGrad = ctx.createLinearGradient(0, 0, size, size);
      baseGrad.addColorStop(0, '#E8D5B5');
      baseGrad.addColorStop(0.3, '#D9BC93');
      baseGrad.addColorStop(0.65, '#C6A275');
      baseGrad.addColorStop(1, '#A98154');
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, size, size);

      const imgData = ctx.getImageData(0, 0, size, size);
      const data = imgData.data;

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = size;
      bumpCanvas.height = size;
      const bctx = bumpCanvas.getContext('2d');
      const bumpData = bctx.createImageData(size, size);
      const bdata = bumpData.data;

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = size;
      roughCanvas.height = size;
      const rctx = roughCanvas.getContext('2d');
      const roughData = rctx.createImageData(size, size);
      const rdata = roughData.data;

      // Multi-layer procedural mineral noise synthesis
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const idx = (y * size + x) * 4;

          // Multiple harmonic frequencies for crystalline fracture lines & sandy grit
          const n1 = (Math.sin(x * 0.28) * Math.cos(y * 0.28) + 1.0) * 0.5;
          const n2 = (Math.sin(x * 0.08 + y * 0.14) * Math.cos(x * 0.16 - y * 0.09) + 1.0) * 0.5;
          const n3 = (Math.sin(x * 0.9 + y * 0.85) * Math.sin(x * 1.4 - y * 0.7) + 1.0) * 0.5;
          const whiteNoise = Math.random();

          // Gritty height value [0..255]
          const height = Math.floor((n1 * 0.35 + n2 * 0.30 + n3 * 0.15 + whiteNoise * 0.20) * 255);

          // Specular mica glints & dark pyroxene / iron micro-speckles
          const isMicaGlint = whiteNoise > 0.978;
          const isDarkMineral = whiteNoise < 0.042;

          let r = data[idx + 0];
          let g = data[idx + 1];
          let b = data[idx + 2];

          if (isMicaGlint) {
            // Bright reflective quartz/mica crystalline inclusion
            r = 255; g = 252; b = 240;
          } else if (isDarkMineral) {
            // Dark iron/volcanic mineral intrusion
            r = Math.floor(r * 0.38);
            g = Math.floor(g * 0.33);
            b = Math.floor(b * 0.28);
          } else {
            // Chipped surface shading based on height relief
            const relief = (height - 128) * 0.42;
            r = Math.min(255, Math.max(0, r + relief));
            g = Math.min(255, Math.max(0, g + relief * 0.92));
            b = Math.min(255, Math.max(0, b + relief * 0.78));
          }

          data[idx + 0] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;
          data[idx + 3] = 255;

          // Strong high-contrast bump map
          bdata[idx + 0] = height;
          bdata[idx + 1] = height;
          bdata[idx + 2] = height;
          bdata[idx + 3] = 255;

          // Roughness map (mica glints are glassy smooth, crevices are coarse)
          const roughVal = isMicaGlint ? 30 : Math.min(255, Math.max(80, Math.floor(230 - height * 0.65)));
          rdata[idx + 0] = roughVal;
          rdata[idx + 1] = roughVal;
          rdata[idx + 2] = roughVal;
          rdata[idx + 3] = 255;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      bctx.putImageData(bumpData, 0, 0);
      rctx.putImageData(roughData, 0, 0);

      const diffuseMap = new THREE.CanvasTexture(canvas);
      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      const roughnessMap = new THREE.CanvasTexture(roughCanvas);

      diffuseMap.wrapS = diffuseMap.wrapT = THREE.RepeatWrapping;
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;

      diffuseMap.repeat.set(3, 3);
      bumpMap.repeat.set(3, 3);
      roughnessMap.repeat.set(3, 3);

      return { diffuseMap, bumpMap, roughnessMap };
    }

    // Creates an authentic 3D microscopic mineral sand grain (chipped quartz with strong tactile grit)
    function create3DSandGrain() {
      const group = new THREE.Group();

      // 1. Organic irregular mineral rock geometry with multi-octave fractal displacement
      const geo = new THREE.DodecahedronGeometry(1.35, 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);
        const len = Math.hypot(vx, vy, vz);

        // 3-tier fractal noise: macro asymmetry + cleavage planes + micro grit
        const f1 = Math.sin(vx * 3.5 + vy * 2.8) * Math.cos(vz * 3.2);
        const f2 = Math.cos(vx * 7.8 - vz * 6.5) * Math.sin(vy * 7.1);
        const f3 = Math.sin(vx * 15.0 + vy * 13.0 + vz * 14.0) * 0.5 + 0.5;

        const noise = 1.0 + f1 * 0.18 + f2 * 0.10 + (f3 - 0.5) * 0.08;
        pos.setXYZ(i, (vx / len) * 1.35 * noise, (vy / len) * 1.35 * noise, (vz / len) * 1.35 * noise);
      }
      geo.computeVertexNormals();

      // 2. High-tactile physical material with procedural bump & roughness maps
      const textures = generateSandTextures();
      const mat = new THREE.MeshStandardMaterial({
        map: textures.diffuseMap,
        bumpMap: textures.bumpMap,
        bumpScale: 0.22,           // Distinct tactile gritty surface relief
        roughnessMap: textures.roughnessMap,
        roughness: 0.62,
        metalness: 0.18,           // Crystalline specular gleam on facets
        flatShading: true,         // Crisp crystalline facets catching directional light
        emissive: 0x382816,        // Warm internal core glow
        emissiveIntensity: 0.45
      });
      sandGrainMesh = new THREE.Mesh(geo, mat);
      group.add(sandGrainMesh);

      // 3. Internal Starlight Core Light (illuminates the grain from within)
      grainInternalLight = new THREE.PointLight(0xFFE8D1, 3.2, 14.0);
      group.add(grainInternalLight);

      // 4. Subtle starlight corona aura surrounding the grain
      const haloCanvas = document.createElement('canvas');
      haloCanvas.width = 128;
      haloCanvas.height = 128;
      const hctx = haloCanvas.getContext('2d');
      const hgrad = hctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      hgrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
      hgrad.addColorStop(0.2, 'rgba(255, 235, 200, 0.5)');
      hgrad.addColorStop(0.55, 'rgba(234, 180, 110, 0.12)');
      hgrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      hctx.fillStyle = hgrad;
      hctx.fillRect(0, 0, 128, 128);

      const haloTex = new THREE.CanvasTexture(haloCanvas);
      const haloMat = new THREE.SpriteMaterial({
        map: haloTex,
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const haloSprite = new THREE.Sprite(haloMat);
      haloSprite.scale.set(2.4, 2.4, 1);
      group.add(haloSprite);

      // Initial placement high in the top-left sky
      group.position.set(-18.0, 24.0, -8.0);
      return group;
    }

          z = (Math.random() - 0.5) * (2.4 * Math.exp(-r * 0.035));

          // Rich harmonic colors: Reds, Purples, Blues & Oranges
          const harmonic1 = Math.sin(r * 0.7 + arm * 2.2);
          const harmonic2 = Math.cos(theta * 1.3 - r * 0.2);
          const mixVal = (harmonic1 * 0.55 + harmonic2 * 0.45 + 1.0) * 0.5;
          const rand = Math.random();

          if (rand < 0.08) {
            col = colorPalette.core;
          } else {
            const domain = (mixVal + (rand - 0.5) * 0.38 + 1.0) % 1.0;
            if (domain < 0.25) {
              col = colorPalette.red[Math.floor(Math.random() * colorPalette.red.length)];
            } else if (domain < 0.50) {
              col = colorPalette.purple[Math.floor(Math.random() * colorPalette.purple.length)];
            } else if (domain < 0.75) {
              col = colorPalette.blue[Math.floor(Math.random() * colorPalette.blue.length)];
            } else {
              col = colorPalette.orange[Math.floor(Math.random() * colorPalette.orange.length)];
            }
          }
        } else {
          // Wide ambient halo
          r = 3.0 + Math.pow(Math.random(), 1.05) * 33.0;
          theta = Math.random() * Math.PI * 2;
          z = (Math.random() - 0.5) * 6.5;

          const haloChoice = Math.random();
          if (haloChoice < 0.25) {
            col = colorPalette.red[Math.floor(Math.random() * colorPalette.red.length)];
          } else if (haloChoice < 0.50) {
            col = colorPalette.purple[Math.floor(Math.random() * colorPalette.purple.length)];
          } else if (haloChoice < 0.75) {
            col = colorPalette.blue[Math.floor(Math.random() * colorPalette.blue.length)];
          } else {
            col = colorPalette.orange[Math.floor(Math.random() * colorPalette.orange.length)];
          }
        }

        const x = Math.cos(theta) * r;
        const y = Math.sin(theta) * r;

        positions[i3 + 0] = 0;
        positions[i3 + 1] = 0;
        positions[i3 + 2] = 0;

        homePositions[i3 + 0] = x;
        homePositions[i3 + 1] = y;
        homePositions[i3 + 2] = z;

        homeRadii[i] = r;
        homeAngles[i] = theta;
        homeZ[i] = z;

        burstTurbulence[i3 + 0] = (Math.random() - 0.5) * 6.5;
        burstTurbulence[i3 + 1] = (Math.random() - 0.5) * 6.5;
        burstTurbulence[i3 + 2] = (Math.random() - 0.5) * 4.5;

        velocities[i3 + 0] = 0;
        velocities[i3 + 1] = 0;
        velocities[i3 + 2] = 0;

        colors[i3 + 0] = col.r;
        colors[i3 + 1] = col.g;
        colors[i3 + 2] = col.b;

        sizes[i] = starSize;
        twinkles[i] = Math.random() * 100.0;
      }

      const galaxyGeo = new THREE.BufferGeometry();
      galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      galaxyGeo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      galaxyGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      galaxyGeo.setAttribute('aTwinkle', new THREE.BufferAttribute(twinkles, 1));

      const galaxyMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uMorph: { value: 0.0 }
        },
        vertexShader: `
          uniform float uTime;
          uniform float uMorph;
          attribute vec3 aColor;
          attribute float aSize;
          attribute float aTwinkle;
          varying vec3 vColor;
          varying float vAlpha;
          varying float vSize;

          void main() {
            vColor = aColor;
            vSize = aSize;
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPos;

            float twSpeed = mix(2.5, 1.2, clamp(aSize / 15.0, 0.0, 1.0));
            float tw = 0.82 + 0.18 * sin(uTime * twSpeed + aTwinkle);
            float sizeBoost = mix(1.0, 1.35, clamp(aSize / 15.0, 0.0, 1.0));
            
            // Constellation luminance boost when assembled into NOVA
            float morphAlpha = mix(1.0, 1.22, uMorph);
            vAlpha = tw * clamp((position.z + 50.0) / 60.0, 0.4, 1.0) * sizeBoost * morphAlpha;

            // Constellation star size boost when assembled
            float morphSize = mix(1.0, 1.30, uMorph);
            gl_PointSize = aSize * (150.0 / -mvPos.z) * tw * morphSize;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;
          varying float vSize;

          void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;

            float core = smoothstep(0.24, 0.0, dist);
            float glow = exp(-dist * 9.5);
            float edge = smoothstep(0.5, 0.15, dist);

            float spike = 0.0;
            if (vSize > 7.0) {
              float spikeIntensity = clamp((vSize - 7.0) / 8.0, 0.0, 1.0);
              float spikeX = exp(-abs(coord.x) * 36.0) * exp(-abs(coord.y) * 4.0);
              float spikeY = exp(-abs(coord.y) * 36.0) * exp(-abs(coord.x) * 4.0);
              spike = max(spikeX, spikeY) * 0.65 * spikeIntensity;
            }

            vec3 finalColor = mix(vColor, vec3(1.0, 1.0, 1.0), core * 0.92 + spike * 0.5);
            float alpha = clamp((core * 0.88 + glow * 0.55 + spike) * edge * vAlpha, 0.0, 1.0);

            gl_FragColor = vec4(finalColor, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      galaxyMesh = new THREE.Points(galaxyGeo, galaxyMat);
      galaxyMesh.visible = false;
      scene.add(galaxyMesh);

      // Central core starlight halo
      const coreCanvas = document.createElement('canvas');
      coreCanvas.width = 128;
      coreCanvas.height = 128;
      const ctx = coreCanvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.20, 'rgba(245, 230, 255, 0.85)');
      grad.addColorStop(0.45, 'rgba(168, 85, 247, 0.28)');
      grad.addColorStop(0.70, 'rgba(56, 189, 248, 0.12)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);

      const coreTexture = new THREE.CanvasTexture(coreCanvas);
      const coreMat = new THREE.SpriteMaterial({
        map: coreTexture,
        color: 0xffffff,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      galaxyCoreMesh = new THREE.Sprite(coreMat);
      galaxyCoreMesh.scale.set(4.8, 4.8, 1);
      galaxyCoreMesh.visible = false;
      scene.add(galaxyCoreMesh);

      // 4. CREATE THE 3D FACETED MINERAL SAND GRAIN ASSET
      sandGrain3DGroup = create3DSandGrain();
      scene.add(sandGrain3DGroup);

      // Supernova Detonation Flash Sprite (Blinding core flash)
      const flashCanvas = document.createElement('canvas');
      flashCanvas.width = 128;
      flashCanvas.height = 128;
      const fctx = flashCanvas.getContext('2d');
      const fgrad = fctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      fgrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      fgrad.addColorStop(0.3, 'rgba(230, 245, 255, 0.95)');
      fgrad.addColorStop(0.65, 'rgba(168, 85, 247, 0.5)');
      fgrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      fctx.fillStyle = fgrad;
      fctx.fillRect(0, 0, 128, 128);

      const flashTex = new THREE.CanvasTexture(flashCanvas);
      const flashMat = new THREE.SpriteMaterial({
        map: flashTex,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      flashMesh = new THREE.Sprite(flashMat);
      flashMesh.scale.set(0.1, 0.1, 1);
      scene.add(flashMesh);

      // Shockwave ring
      const ringCanvas = document.createElement('canvas');
      ringCanvas.width = 128;
      ringCanvas.height = 128;
      const rctx = ringCanvas.getContext('2d');
      rctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
      rctx.lineWidth = 5;
      rctx.beginPath();
      rctx.arc(64, 64, 56, 0, Math.PI * 2);
      rctx.stroke();

      const shockTex = new THREE.CanvasTexture(ringCanvas);
      const shockMat = new THREE.SpriteMaterial({
        map: shockTex,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      shockwaveMesh = new THREE.Sprite(shockMat);
      shockwaveMesh.scale.set(0.1, 0.1, 1);
      scene.add(shockwaveMesh);

      // Distant micro-starfield (background space depth)
      const bgStarCount = 2800;
      const bgGeo = new THREE.BufferGeometry();
      const bgPos = new Float32Array(bgStarCount * 3);
      for (let i = 0; i < bgStarCount * 3; i += 3) {
        bgPos[i] = (Math.random() - 0.5) * 350;
        bgPos[i + 1] = (Math.random() - 0.5) * 220;
        bgPos[i + 2] = -40 - Math.random() * 180;
      }
      bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
      const bgMat = new THREE.PointsMaterial({
        size: 1.2,
        color: 0xd6e5ff,
        transparent: true,
        opacity: 0.45,
        depthWrite: false
      });
      starfieldMesh = new THREE.Points(bgGeo, bgMat);
      scene.add(starfieldMesh);

      // 6b. BED OF STARS AT THE BOTTOM OF THE SCREEN
      const starBedGeo = new THREE.BufferGeometry();

      for (let i = 0; i < starBedCount; i++) {
        // Size hierarchy matching NOVA: tiny stardust, medium stars, radiant stars, mega-giants
        const roll = Math.random();
        let starSize;
        if (i < starBedCount * 0.35) {
          // Border crest stars: higher proportion of bright radiant stars to make the border pop!
          if (roll < 0.65) {
            starSize = 1.2 + Math.random() * 1.5;
          } else if (roll < 0.85) {
            starSize = 3.2 + Math.random() * 2.5;
          } else if (roll < 0.95) {
            starSize = 6.8 + Math.random() * 3.5;
          } else {
            starSize = 12.0 + Math.random() * 4.0; // Spectacular mega-giants along the border
          }
        } else {
          // Sea body stars spanning down the page
          if (roll < 0.78) {
            starSize = 1.0 + Math.random() * 1.4;
          } else if (roll < 0.92) {
            starSize = 2.6 + Math.random() * 2.2;
          } else if (roll < 0.98) {
            starSize = 5.8 + Math.random() * 3.0;
          } else {
            starSize = 10.5 + Math.random() * 3.5;
          }
        }
        starBedSizes[i] = starSize;
        starBedTwinkles[i] = Math.random() * 100.0;

        // Rich colors from NOVA colorPalette: cyan, blue, purple, red, orange, and core white
        let col;
        const cRoll = Math.random();
        if (cRoll < 0.12) {
          col = colorPalette.core;
        } else if (cRoll < 0.36) {
          col = colorPalette.blue[Math.floor(Math.random() * colorPalette.blue.length)];
        } else if (cRoll < 0.58) {
          col = colorPalette.purple[Math.floor(Math.random() * colorPalette.purple.length)];
        } else if (cRoll < 0.80) {
          col = colorPalette.orange[Math.floor(Math.random() * colorPalette.orange.length)];
        } else {
          col = colorPalette.red[Math.floor(Math.random() * colorPalette.red.length)];
        }

        starBedColors[i * 3 + 0] = col.r;
        starBedColors[i * 3 + 1] = col.g;
        starBedColors[i * 3 + 2] = col.b;
      }

      const bPosAttr = new THREE.BufferAttribute(starBedPositions, 3).setUsage(THREE.DynamicDrawUsage);
      const bColAttr = new THREE.BufferAttribute(starBedColors, 3);
      const bSizeAttr = new THREE.BufferAttribute(starBedSizes, 1);
      const bTwinkleAttr = new THREE.BufferAttribute(starBedTwinkles, 1);

      starBedGeo.setAttribute('position', bPosAttr);
      starBedGeo.setAttribute('aColor', bColAttr);
      starBedGeo.setAttribute('aSize', bSizeAttr);
      starBedGeo.setAttribute('aTwinkle', bTwinkleAttr);

      // Exact high-fidelity shader matching NOVA (core, glow, spikes, twinkling, additive blending)
      const starBedMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uMorph: { value: 0.0 }
        },
        vertexShader: `
          uniform float uTime;
          uniform float uMorph;
          attribute vec3 aColor;
          attribute float aSize;
          attribute float aTwinkle;
          varying vec3 vColor;
          varying float vAlpha;
          varying float vSize;

          void main() {
            vColor = aColor;
            vSize = aSize;
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPos;

            float twSpeed = mix(2.5, 1.2, clamp(aSize / 15.0, 0.0, 1.0));
            float tw = 0.82 + 0.18 * sin(uTime * twSpeed + aTwinkle);
            float sizeBoost = mix(1.0, 1.35, clamp(aSize / 15.0, 0.0, 1.0));

            vAlpha = tw * uMorph * sizeBoost;
            gl_PointSize = aSize * (150.0 / -mvPos.z) * tw;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;
          varying float vSize;

          void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;

            float core = smoothstep(0.24, 0.0, dist);
            float glow = exp(-dist * 9.5);
            float edge = smoothstep(0.5, 0.15, dist);

            float spike = 0.0;
            if (vSize > 7.0) {
              float spikeIntensity = clamp((vSize - 7.0) / 8.0, 0.0, 1.0);
              float spikeX = exp(-abs(coord.x) * 36.0) * exp(-abs(coord.y) * 4.0);
              float spikeY = exp(-abs(coord.y) * 36.0) * exp(-abs(coord.x) * 4.0);
              spike = max(spikeX, spikeY) * 0.65 * spikeIntensity;
            }

            vec3 finalColor = mix(vColor, vec3(1.0, 1.0, 1.0), core * 0.92 + spike * 0.5);
            float alpha = clamp((core * 0.88 + glow * 0.55 + spike) * edge * vAlpha, 0.0, 1.0);

            gl_FragColor = vec4(finalColor, alpha);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      starBedMesh = new THREE.Points(starBedGeo, starBedMat);
      starBedMesh.frustumCulled = false;
      starBedMesh.visible = false;
      scene.add(starBedMesh);

      layoutStarBed();

      // Event Listeners for fluid cursor interaction & responsive layout
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('touchstart', onTouchStart, { passive: true });
      window.addEventListener('touchmove', onTouchMove, { passive: true });
      window.addEventListener('touchend', onTouchEnd, { passive: true });

      animate();
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);

      // Re-generate responsive NOVA targets for new aspect ratio / device orientation
      if (starCount && typeof generateNovaTargets === 'function') {
        novaTargets = generateNovaTargets(starCount);
      }

      layoutStarBed();
      if (typeof syncConstellationBtn === 'function') syncConstellationBtn();
      const uiText = document.getElementById('ui-visibility-text');
      if (uiText) {
        const isSmall = window.innerWidth < 640;
        uiText.textContent = isUiVisible ? (isSmall ? 'HIDE' : 'HIDE UI') : (isSmall ? 'UI' : 'SHOW UI');
      }
    }

    function onMouseMove(e) {
      isMouseActive = true;
      mouse2D.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse2D.y = -(e.clientY / window.innerHeight) * 2 + 1;
    }

    let touchStartY = 0;
    function onTouchStart(e) {
      if (e.touches.length > 0) {
        touchStartY = e.touches[0].clientY;
        isMouseActive = true;
        mouse2D.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        mouse2D.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
      }
    }

    function onTouchMove(e) {
      if (e.touches.length > 0) {
        isMouseActive = true;
        mouse2D.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        mouse2D.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;

        // Mobile touch swipe gestures drive page scroll & NOVA morphing
        if (introComplete) {
          const deltaY = touchStartY - e.touches[0].clientY;
          touchStartY = e.touches[0].clientY;
          const maxScroll = Math.max(window.innerHeight * 0.85, 380.0);
          const currentScroll = window.scrollY || window.pageYOffset || 0;
          const newScroll = THREE.MathUtils.clamp(currentScroll + deltaY * 1.5, 0, maxScroll);
          window.scrollTo({ top: newScroll, behavior: 'auto' });
          if (typeof updateScrollMorph === 'function') updateScrollMorph();
        }
      }
    }

    function onTouchEnd() {
      isMouseActive = false;
    }

    // Main 60fps render loop with Cinematic Intro & Fluid Dynamics
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      if (introStartTime === 0) introStartTime = elapsedTime;
      const introT = elapsedTime - introStartTime;
      const targetCamZ = getResponsiveCamZ();

      // ----------------------------------------------------
      // CINEMATIC TIMELINE:
      // 0.0s - 1.5s: 3D Faceted Sand Grain falls tumbling from top-left, camera swoops from bottom
      // 1.5s - 1.9s: 3D Grain halts at center, charges & shakes with blinding power
      // 1.9s - 3.4s: SUPERNOVA DETONATION: supersonic burst expanding into logarithmic nebula!
      // 3.2s - 4.2s: UI blooms smoothly after nebula is fully formed
      // 3.4s+: Fluid cursor interaction engages
      // ----------------------------------------------------

      if (introT < 1.5) {
        // --- PHASE 1: 3D TUMBLING GRAIN FALLS FROM TOP-LEFT (Low camera viewing top-left) ---
        const p = Math.min(Math.max(introT / 1.5, 0.0), 1.0);
        const ease = p * p * (3.0 - 2.0 * p); // smooth cubic Hermite

        // 3D Grain falls along curved trajectory: (-18, 24, -8) -> (0, 0, 0)
        sandGrain3DGroup.position.x = THREE.MathUtils.lerp(-18.0, 0.0, ease);
        sandGrain3DGroup.position.y = THREE.MathUtils.lerp(24.0, 0.0, ease);
        sandGrain3DGroup.position.z = THREE.MathUtils.lerp(-8.0, 0.0, ease);

        // Realistic 3D tumbling rotation catching light on mineral facets
        if (sandGrainMesh) {
          sandGrainMesh.rotation.x += 0.038;
          sandGrainMesh.rotation.y += 0.052;
          sandGrainMesh.rotation.z += 0.025;
        }

        // Camera starts low down at (8, -18, 26) looking up, swoops up to level (0, 0, targetCamZ)
        camera.position.x = THREE.MathUtils.lerp(8.0, 0.0, ease);
        camera.position.y = THREE.MathUtils.lerp(-18.0, 0.0, ease);
        camera.position.z = THREE.MathUtils.lerp(26.0, targetCamZ, ease);

        const lookX = THREE.MathUtils.lerp(-10.0, 0.0, ease);
        const lookY = THREE.MathUtils.lerp(14.0, 0.0, ease);
        camera.lookAt(lookX, lookY, 0.0);

        renderer.render(scene, camera);
        return;

      } else if (introT < 1.9) {
        // --- PHASE 2: 3D GRAIN PAUSES AT CENTER & CHARGES ---
        camera.position.set(0, 0, targetCamZ);
        camera.lookAt(0, 0, 0);

        const chargeP = (introT - 1.5) / 0.4;
        const swell = 1.0 + chargeP * 2.2;
        sandGrain3DGroup.scale.set(swell, swell, swell);

        // Rapid tumbling & intense vibration
        if (sandGrainMesh) {
          sandGrainMesh.rotation.x += 0.09;
          sandGrainMesh.rotation.y += 0.12;
          sandGrainMesh.rotation.z += 0.06;
          // Emissive intensity ramps up to blinding white-hot
          sandGrainMesh.material.emissiveIntensity = 0.65 + chargeP * 5.0;
        }

        if (grainInternalLight) {
          grainInternalLight.intensity = 3.2 + chargeP * 12.0;
        }

        // High frequency tremor
        sandGrain3DGroup.position.set(
          (Math.random() - 0.5) * 0.22,
          (Math.random() - 0.5) * 0.22,
          0.0
        );

        renderer.render(scene, camera);
        return;

      } else if (introT < 3.4) {
        // --- PHASE 3: SUPERSONIC SUPERNOVA EXPLOSION INTO NEBULA (1.9s to 3.4s) ---
        if (!hasExploded) {
          hasExploded = true;
          sandGrain3DGroup.visible = false; // 3D grain shatters into 12,500 stars!
          galaxyMesh.visible = true;
          galaxyCoreMesh.visible = true;
          galaxyCoreMesh.scale.set(0.1, 0.1, 1);
        }

        camera.position.set(0, 0, targetCamZ);
        camera.lookAt(0, 0, 0);

        const explodeP = (introT - 1.9) / 1.5; // 0.0 to 1.0 over 1.5s
        // Explosive Quartic Ease-Out: 76% expanded in first 0.45s!
        const ease = 1.0 - Math.pow(1.0 - explodeP, 4.0);

        // 1. Detonation Flash (intense white-hot explosion flash)
        if (explodeP < 0.3) {
          const flashP = explodeP / 0.3;
          flashMesh.scale.set(18.0 * flashP, 18.0 * flashP, 1);
          flashMesh.material.opacity = (1.0 - flashP) * 1.0;
        } else if (flashMesh.material.opacity > 0) {
          flashMesh.material.opacity = 0;
        }

        // 2. Shockwave Expansion
        if (explodeP < 0.6) {
          const swP = explodeP / 0.6;
          shockwaveMesh.scale.set(45.0 * swP, 45.0 * swP, 1);
          shockwaveMesh.material.opacity = (1.0 - swP) * 0.95;
        } else if (shockwaveMesh.material.opacity > 0) {
          shockwaveMesh.material.opacity = 0;
        }

        // 3. 12,500 Star Explosive Expansion directly into Logarithmic Spiral Arms
        const posAttr = galaxyMesh.geometry.attributes.position;
        const posArr = posAttr.array;

        // Preloaded continuous spin active from frame 1 of detonation + explosive uncurling
        const unwindAngle = (1.0 - ease) * 1.35;
        const turbDecay = (1.0 - ease) * 2.5;

        for (let i = 0; i < starCount; i++) {
          homeAngles[i] += rotSpeed; // Continuous spin preloaded and active from the moment it unravels!
          const i3 = i * 3;
          const r = homeRadii[i] * ease;
          const theta = homeAngles[i] + unwindAngle;

          const px = Math.cos(theta) * r + burstTurbulence[i3 + 0] * turbDecay;
          const py = Math.sin(theta) * r + burstTurbulence[i3 + 1] * turbDecay;
          const pz = homeZ[i] * ease + burstTurbulence[i3 + 2] * turbDecay;

          posArr[i3 + 0] = px;
          posArr[i3 + 1] = py;
          posArr[i3 + 2] = pz;
        }
        posAttr.needsUpdate = true;

        // Core halo swells to full size
        if (galaxyCoreMesh) {
          const coreScale = 4.8 * ease;
          galaxyCoreMesh.scale.set(coreScale, coreScale, 1);
        }



        if (galaxyMesh.material.uniforms) {
          galaxyMesh.material.uniforms.uTime.value = elapsedTime;
          if (galaxyMesh.material.uniforms.uMorph) {
            galaxyMesh.material.uniforms.uMorph.value = 0.0;
          }
        }

        renderer.render(scene, camera);
        return;
      }

      // --- PHASE 4: INTERACTIVE FLUID GALAXY (introComplete = true) ---
      if (!introComplete) {
        introComplete = true;
        for (let i = 0; i < starCount * 3; i++) {
          velocities[i] = 0;
          fluidOffsets[i] = 0;
        }


      }

      // 1. Raycast cursor coordinates onto galaxy plane (z = 0)
      if (isMouseActive) {
        raycaster.setFromCamera(mouse2D, camera);
        const intersection = new THREE.Vector3();
        const hasIntersect = raycaster.ray.intersectPlane(galaxyPlane, intersection);
        if (hasIntersect) {
          cursor3D.copy(intersection);
          if (isFirstMouseMove) {
            prevCursor3D.copy(cursor3D);
            isFirstMouseMove = false;
          }
        }
      } else {
        cursor3D.set(9999, 9999, 0);
        prevCursor3D.set(9999, 9999, 0);
      }

      const cursorVx = isMouseActive ? cursor3D.x - prevCursor3D.x : 0;
      const cursorVy = isMouseActive ? cursor3D.y - prevCursor3D.y : 0;
      const cursorSpeed = Math.hypot(cursorVx, cursorVy);
      if (isMouseActive) prevCursor3D.copy(cursor3D);

      // 2. Laminar Fluid Physics & Seamless Constant Galactic Spin
      const radius = 3.4;
      const radiusSq = radius * radius;
      const posAttr = galaxyMesh.geometry.attributes.position;
      const posArr = posAttr.array;

      // Smoothly ease morphProgress toward targetMorph (0.0 = spiral galaxy, 1.0 = assembled NOVA)
      morphProgress += (targetMorph - morphProgress) * 0.065;

      // Reveal makeshift nav bar ONLY when user scrolls to completed NOVA text
      const makeshiftNav = document.getElementById('makeshift-nav');
      if (makeshiftNav && introComplete) {
        if (morphProgress >= 0.88) {
          if (makeshiftNav.classList.contains('opacity-0')) {
            makeshiftNav.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
            makeshiftNav.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
          }
        } else {
          if (!makeshiftNav.classList.contains('opacity-0')) {
            makeshiftNav.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
            makeshiftNav.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
          }
        }
      }

      const stickDirX = cursorSpeed > 0.0001 ? cursorVx / cursorSpeed : 0;
      const stickDirY = cursorSpeed > 0.0001 ? cursorVy / cursorSpeed : 0;
      const perpX = -stickDirY;
      const perpY = stickDirX;

      const isMorphing = morphProgress > 0.0005 && novaTargets;

      for (let i = 0; i < starCount; i++) {
        const i3 = i * 3;
        homeAngles[i] += rotSpeed; // Constant steady spin continues with zero lag!
        const hx = homeRadii[i] * Math.cos(homeAngles[i]);
        const hy = homeRadii[i] * Math.sin(homeAngles[i]);
        const hz = homeZ[i];

        let finalX = hx;
        let finalY = hy;
        let finalZ = hz;

        if (isMorphing) {
          const delay = starDelays[i];
          const rawP = THREE.MathUtils.clamp((morphProgress - delay * 0.35) / 0.65, 0.0, 1.0);
          const p = rawP * rawP * (3.0 - 2.0 * rawP);

          const nx = novaTargets[i3 + 0];
          const ny = novaTargets[i3 + 1];
          const nz = novaTargets[i3 + 2];

          // Graceful celestial inward swirl arc
          const swirlArc = p * (1.0 - p) * 1.5;
          const swirlX = -hy * swirlArc * 0.20;
          const swirlY = hx * swirlArc * 0.20;

          finalX = THREE.MathUtils.lerp(hx, nx, p) + swirlX;
          finalY = THREE.MathUtils.lerp(hy, ny, p) + swirlY;
          finalZ = THREE.MathUtils.lerp(hz, nz, p);
        }

        let px = finalX + fluidOffsets[i3 + 0];
        let py = finalY + fluidOffsets[i3 + 1];

        const dx = px - cursor3D.x;
        const dy = py - cursor3D.y;

        if (Math.abs(dx) < radius && Math.abs(dy) < radius) {
          const distSq = dx * dx + dy * dy;
          if (distSq < radiusSq) {
            const dist = Math.sqrt(distSq) + 0.001;
            const t = 1.0 - dist / radius;
            const factor = t * t * (3.0 - 2.0 * t);

            const side = dx * perpX + dy * perpY;
            const sideSign = side >= 0 ? 1.0 : -1.0;

            const lateralMag = factor * 0.026 * Math.min(cursorSpeed * 0.22 + 0.35, 0.85);
            const radialMag = factor * factor * 0.016;

            velocities[i3 + 0] += perpX * sideSign * lateralMag + (dx / dist) * radialMag;
            velocities[i3 + 1] += perpY * sideSign * lateralMag + (dy / dist) * radialMag;
            velocities[i3 + 2] += (Math.random() - 0.5) * factor * 0.010;
          }
        }

        // Fluid displacement restoring spring & damping
        velocities[i3 + 0] = (velocities[i3 + 0] - fluidOffsets[i3 + 0] * 0.06) * 0.88;
        velocities[i3 + 1] = (velocities[i3 + 1] - fluidOffsets[i3 + 1] * 0.06) * 0.88;
        velocities[i3 + 2] = (velocities[i3 + 2] - fluidOffsets[i3 + 2] * 0.06) * 0.88;

        fluidOffsets[i3 + 0] += velocities[i3 + 0];
        fluidOffsets[i3 + 1] += velocities[i3 + 1];
        fluidOffsets[i3 + 2] += velocities[i3 + 2];

        posArr[i3 + 0] = finalX + fluidOffsets[i3 + 0];
        posArr[i3 + 1] = finalY + fluidOffsets[i3 + 1];
        posArr[i3 + 2] = finalZ + fluidOffsets[i3 + 2];
      }

      posAttr.needsUpdate = true;

      if (galaxyMesh.material.uniforms) {
        galaxyMesh.material.uniforms.uTime.value = elapsedTime;
        if (galaxyMesh.material.uniforms.uMorph) {
          galaxyMesh.material.uniforms.uMorph.value = morphProgress;
        }
      }

      // Smooth camera micro-drift (strictly clamped, safe)
      if (isMouseActive) {
        const targetCamX = THREE.MathUtils.clamp(mouse2D.x * 2.2, -2.5, 2.5);
        const targetCamY = THREE.MathUtils.clamp(mouse2D.y * 1.6, -2.0, 2.0);
        camera.position.x += (targetCamX - camera.position.x) * 0.03;
        camera.position.y += (targetCamY - camera.position.y) * 0.03;
      } else {
        camera.position.x += (0.0 - camera.position.x) * 0.03;
        camera.position.y += (0.0 - camera.position.y) * 0.03;
      }
      camera.position.z += (targetCamZ - camera.position.z) * 0.08;
      camera.lookAt(0, 0, 0);

      // Core pulse - softens and dims when NOVA is assembled so letters stand out brilliantly
      if (galaxyCoreMesh) {
        const pulse = 1.0 + 0.08 * Math.sin(elapsedTime * 2.5);
        const coreScale = 4.8 * pulse * (1.0 - morphProgress * 0.65);
        galaxyCoreMesh.scale.set(coreScale, coreScale, 1);
        galaxyCoreMesh.material.opacity = 0.85 * (1.0 - morphProgress * 0.50);
      }

      // ----------------------------------------------------
      // BED OF STARS AT THE BOTTOM OF THE SCREEN
      // Shown ONLY when scrolled to NOVA (no physics, no mouse reactions)
      // ----------------------------------------------------
      if (starBedMesh) {
        if (introComplete && morphProgress > 0.02) {
          // Smoothly blooms in as you scroll to NOVA
          const rawP = THREE.MathUtils.clamp((morphProgress - 0.10) / 0.65, 0.0, 1.0);
          const bedAlpha = rawP * rawP * (3.0 - 2.0 * rawP); // smoothstep curve

          if (bedAlpha > 0.001) {
            starBedMesh.visible = true;
            if (starBedMesh.material.uniforms) {
              starBedMesh.material.uniforms.uTime.value = elapsedTime;
              starBedMesh.material.uniforms.uMorph.value = bedAlpha;
            }
          } else {
            starBedMesh.visible = false;
            if (starBedMesh.material.uniforms) {
              starBedMesh.material.uniforms.uMorph.value = 0.0;
            }
          }
        } else {
          starBedMesh.visible = false;
          if (starBedMesh.material.uniforms) {
            starBedMesh.material.uniforms.uMorph.value = 0.0;
          }
        }
      }

      renderer.render(scene, camera);
    }

    // Replays the 3D sand grain fall and supernova explosion intro seamlessly
    function replayIntroAnimation() {
      introStartTime = clock.getElapsedTime();
      hasExploded = false;
      introComplete = false;
      isMouseActive = false;
      isFirstMouseMove = true;
      cursor3D.set(9999, 9999, 0);
      prevCursor3D.set(9999, 9999, 0);

      // Reset NOVA constellation morph state
      targetMorph = 0.0;
      morphProgress = 0.0;
      wheelScrollAccumulator = 0.0;

      camera.position.set(8.0, -18.0, 26.0);

      if (sandGrain3DGroup) {

        }

          grainInternalLight.intensity = 3.2;
        }

      // Hide galaxy and blast effects until detonation at 1.9s
      if (galaxyMesh) {
        galaxyMesh.visible = false;
        const posAttr = galaxyMesh.geometry.attributes.position;
        const posArr = posAttr.array;
        for (let i = 0; i < starCount * 3; i++) {
          posArr[i] = 0;
          velocities[i] = 0;
          fluidOffsets[i] = 0;
        }
        posAttr.needsUpdate = true;
      }
      if (galaxyCoreMesh) {
        galaxyCoreMesh.visible = false;
        galaxyCoreMesh.scale.set(0.1, 0.1, 1);
      }
      if (flashMesh) {
        flashMesh.material.opacity = 0;
        flashMesh.scale.set(0.1, 0.1, 1);
      }
      if (shockwaveMesh) {

        shockwaveMesh.scale.set(0.1, 0.1, 1);

      if (starBedMesh) {
        starBedMesh.visible = false;
        if (starBedMesh.material.uniforms) {
          starBedMesh.material.uniforms.uMorph.value = 0.0;
        }
      }

      // Reset window scroll & hide makeshift navbar
      window.scrollTo({ top: 0, behavior: 'auto' });
      const makeshiftNav = document.getElementById('makeshift-nav');
      if (makeshiftNav) {
        makeshiftNav.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
        makeshiftNav.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }
      const uiText = document.getElementById('ui-visibility-text');
      if (uiText) {
        const isSmall = window.innerWidth < 640;
        uiText.textContent = isSmall ? 'UI' : 'SHOW UI';
      }
      const uiBtn = document.getElementById('ui-visibility-toggle');
      if (uiBtn) {
        uiBtn.classList.remove('border-starlight/60', 'bg-starlight/20', 'text-white');
        uiBtn.classList.add('border-starlight/30', 'bg-starlight/10', 'text-starlight');
      }
    }

    // Copy configuration JSON to clipboard
    function copyProbeConfig(probeId, buttonElement) {
      const probe = MCP_PROBES.find(p => p.id === probeId);
      if (!probe) return;

      const configText = JSON.stringify(probe.config, null, 2);
      navigator.clipboard.writeText(configText).then(() => {
        cosmicAudio.playClickChime();
        showToast(`// TELEMETRY COPIED: ${probe.name}`);

        if (buttonElement) {
          const btnText = buttonElement.querySelector('.btn-text');
          const originalText = btnText ? btnText.textContent : 'Copy Config';
          if (btnText) btnText.textContent = 'COPIED // 0x7F';
          buttonElement.classList.add('bg-starlight', 'text-void-950', 'border-starlight');
          buttonElement.classList.remove('bg-starlight/10', 'text-starlight');

          setTimeout(() => {
            if (btnText) btnText.textContent = originalText;
            buttonElement.classList.remove('bg-starlight', 'text-void-950', 'border-starlight');
            buttonElement.classList.add('bg-starlight/10', 'text-starlight');
          }, 2000);
        }
      }).catch(err => {
        console.error('Clipboard copy failed:', err);
      });
    }

    // Inspect probe details in Modal
    function inspectProbe(probeId) {
      const probe = MCP_PROBES.find(p => p.id === probeId);
      if (!probe) return;

      cosmicAudio.playClickChime();

      document.getElementById('modal-title').textContent = probe.name;
      document.getElementById('modal-spec').textContent = `SPEC: ${probe.spec} • TRANSPORT: ${probe.transport.toUpperCase()}`;
      document.getElementById('modal-description').textContent = probe.description;

      const toolsContainer = document.getElementById('modal-tools');
      toolsContainer.innerHTML = probe.tools.map(t => `
        <span class="px-2.5 py-1 rounded-lg bg-void-950 border border-white/10 text-starlight text-[11px] font-mono">
          ${t}
        </span>
      `).join('');

      const jsonStr = JSON.stringify(probe.config, null, 2);
      document.getElementById('modal-json').textContent = jsonStr;
      document.getElementById('modal-command').textContent = probe.command;

      document.getElementById('modal-copy-btn').onclick = () => {
        navigator.clipboard.writeText(jsonStr);
        cosmicAudio.playClickChime();
        showToast("// CLIENT CONFIG COPIED");
      };

      document.getElementById('modal-copy-cmd-btn').onclick = () => {
        navigator.clipboard.writeText(probe.command);
        cosmicAudio.playClickChime();
        showToast("// COMMAND LINE COPIED");
      };

      openModal('inspect-modal');
    }

    // Toast Notification System
    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'glass-card border-starlight/30 text-starlight text-xs font-mono px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 transform transition-all duration-300 translate-y-4 opacity-0 pointer-events-auto';
      toast.innerHTML = `
        <span class="w-1.5 h-1.5 rounded-full bg-starlight animate-ping"></span>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 400);
      }, 3500);
    }

          mainUi.classList.add('opacity-0', 'pointer-events-none');

      if (uiText) {
        const isSmall = window.innerWidth < 640;
        uiText.textContent = isUiVisible ? (isSmall ? 'HIDE' : 'HIDE UI') : (isSmall ? 'UI' : 'SHOW UI');
      }

      if (uiBtn) {
        if (isUiVisible) {
          uiBtn.classList.add('border-starlight/60', 'bg-starlight/20', 'text-white');
          uiBtn.classList.remove('border-starlight/30', 'bg-starlight/10', 'text-starlight');
        } else {
          uiBtn.classList.remove('border-starlight/60', 'bg-starlight/20', 'text-white');
          uiBtn.classList.add('border-starlight/30', 'bg-starlight/10', 'text-starlight');
        }
      }

      showToast(isUiVisible ? "// UI DIRECTORY & TYPOGRAPHY REVEALED" : "// OBSERVATION MODE: COSMIC VOID");
    }

    // Observation Mode (Pure Cosmic Background Mode)
    function toggleObservationMode() {
      toggleUiVisibility();
    }

    // Synchronized Anticlockwise Nebula Drift Status
    function toggleRotationDirection() {
      if (cosmicAudio && cosmicAudio.playClickChime) cosmicAudio.playClickChime();
      showToast("// NEBULA MOTION: SYNCHRONIZED ANTICLOCKWISE DRIFT");
    }

    // Broadcast Form Handler
    function handleBroadcast(e) {
      e.preventDefault();
      cosmicAudio.playClickChime();

      const name = document.getElementById('broadcast-name').value;
      const transport = document.getElementById('broadcast-transport').value;
      const category = document.getElementById('broadcast-category').value;
      const pkg = document.getElementById('broadcast-pkg').value;
      const desc = document.getElementById('broadcast-desc').value;

      const newProbe = {
        id: `custom-${Date.now()}`,
        name: name,
        category: category,
        categoryLabel: category.toUpperCase(),
        icon: "radio",
        status: "ACTIVE // 99.9% SIGNAL",
        statusColor: "signal-green",
        spec: "MCP/2024-11-05",
        transport: transport,
        toolsCount: 3,
        resourcesCount: 1,
        tools: ["custom_action", "status_ping", "execute"],
        description: desc,
        command: pkg,
        config: {
          mcpServers: {
            [name.toLowerCase().replace(/[^a-z0-9]/g, '-')]: {
              command: pkg.split(' ')[0],
              args: pkg.split(' ').slice(1)
            }
          }
        }
      };

      MCP_PROBES.unshift(newProbe);
      renderProbeCards();
      closeModal('transmit-modal');
      e.target.reset();

      showToast(`// NEW BEACON BROADCASTED: ${name}`);
    }

    // Live UTC Clock updater
    function startUtcClock() {
      const clockEl = document.getElementById('utc-clock');
      function update() {
        const now = new Date();
        const h = String(now.getUTCHours()).padStart(2, '0');
        const m = String(now.getUTCMinutes()).padStart(2, '0');
        const s = String(now.getUTCSeconds()).padStart(2, '0');
        if (clockEl) clockEl.textContent = `${h}:${m}:${s} UTC`;
      }
      update();
      setInterval(update, 1000);
    }

    // ----------------------------------------------------
    // 5. APPLICATION INITIALIZATION & EVENT BINDINGS
    // ----------------------------------------------------
    function initApp() {
      // 1. Start 3D Scene
      initCosmicScene();

      // 2. Makeshift Nav: Top-Left 3-Line Hamburger Menu (Scroll to top & return to nebula)
      const hamburgerBtn = document.getElementById('nav-hamburger-btn');
      if (hamburgerBtn) {
        hamburgerBtn.addEventListener('click', () => {
          if (cosmicAudio && cosmicAudio.playClickChime) cosmicAudio.playClickChime();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          targetMorph = 0.0;
          wheelScrollAccumulator = 0.0;
        });
      }

      // 3. Makeshift Nav: Top-Right Crescent Moon (Toggle Ambient Sound)
      const moonBtn = document.getElementById('nav-moon-btn');
      if (moonBtn) {
        moonBtn.addEventListener('click', () => {
          if (cosmicAudio) {
            const isPlaying = cosmicAudio.toggle();
            if (isPlaying) {
              moonBtn.classList.add('border-starlight/60', 'bg-starlight/20', 'text-white', 'shadow-[0_0_15px_rgba(232,213,181,0.25)]');
            } else {
              moonBtn.classList.remove('border-starlight/60', 'bg-starlight/20', 'text-white', 'shadow-[0_0_15px_rgba(232,213,181,0.25)]');
            }
          }
        });
      }

      // 8b. Scroll & Gesture Driven Apple-Font "NOVA" Morphing Engine
      function syncConstellationBtn() {
        const constellationBtn = document.getElementById('constellation-toggle');
        const constellationText = document.getElementById('constellation-text');
        const isAssembled = targetMorph > 0.5;
        const isSmallScreen = window.innerWidth < 640;
        if (constellationText) {
          if (isSmallScreen) {
            constellationText.textContent = isAssembled ? 'GALAXY' : 'NOVA';
          } else {
            constellationText.textContent = isAssembled ? 'SPIRAL GALAXY' : 'NOVA LOCK';
          }
        }
        if (constellationBtn) {
          if (isAssembled) {
            constellationBtn.classList.add('border-starlight/60', 'bg-starlight/20', 'text-white');
            constellationBtn.classList.remove('border-starlight/40', 'bg-starlight/10', 'text-starlight');
          } else {
            constellationBtn.classList.remove('border-starlight/60', 'bg-starlight/20', 'text-white');
            constellationBtn.classList.add('border-starlight/40', 'bg-starlight/10', 'text-starlight');
          }
        }
      }

      function updateScrollMorph() {
        if (!introComplete) return;
        const pageScrollY = window.scrollY || window.pageYOffset || 0;
        const maxScroll = Math.max(window.innerHeight * 0.85, 380.0);
        const scrollProgress = THREE.MathUtils.clamp(pageScrollY / maxScroll, 0.0, 1.0);
        targetMorph = THREE.MathUtils.clamp(Math.max(scrollProgress, wheelScrollAccumulator), 0.0, 1.0);
      }

      function onWheelScroll(e) {
        if (!introComplete) return;
        wheelScrollAccumulator += e.deltaY * 0.0024;
        wheelScrollAccumulator = THREE.MathUtils.clamp(wheelScrollAccumulator, 0.0, 1.0);
        updateScrollMorph();
      }

      window.addEventListener('scroll', updateScrollMorph, { passive: true });
      window.addEventListener('wheel', onWheelScroll, { passive: true });

      function toggleConstellation() {
        cosmicAudio.playClickChime();
        if (targetMorph > 0.5) {
          targetMorph = 0.0;
          wheelScrollAccumulator = 0.0;
        } else {
          targetMorph = 1.0;
          wheelScrollAccumulator = 1.0;
        }
        syncConstellationBtn();
        showToast(targetMorph > 0.5 ? "// CONSTELLATION ASSEMBLED: NOVA (APPLE TYPOGRAPHY)" : "// STARS DISPERSED INTO SPIRAL GALAXY");
      }

      const constellationBtn = document.getElementById('constellation-toggle');
      if (constellationBtn) {
        constellationBtn.addEventListener('click', toggleConstellation);
      }

      // Replay Intro Button Listener
      const replayBtn = document.getElementById('replay-intro-btn');
      if (replayBtn) {
        replayBtn.addEventListener('click', replayIntroAnimation);
      }

      // 9. Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        // Space or M key toggles audio (when not typing in an input)
        if ((e.code === 'Space' || e.key === 'm' || e.key === 'M') && !e.target.matches('input, textarea')) {
          e.preventDefault();
          if (moonBtn) moonBtn.click();
        }
        // R key replays the 3D sand grain fall & supernova intro
        if ((e.key === 'r' || e.key === 'R') && !e.target.matches('input, textarea')) {
          replayIntroAnimation();
        }
        // D key status reminder (Synchronized Anticlockwise)
        if ((e.key === 'd' || e.key === 'D') && !e.target.matches('input, textarea')) {
          toggleRotationDirection();
        }
        // C key toggles ASTRA Constellation vs Free Nebula Drift
        if ((e.key === 'c' || e.key === 'C') && !e.target.matches('input, textarea')) {
          toggleConstellation();
        }
        // U key toggles UI visibility
        if ((e.key === 'u' || e.key === 'U' || e.key === 'v' || e.key === 'V') && !e.target.matches('input, textarea')) {
          toggleUiVisibility();
        }
        // ⌘K or Ctrl+K for command palette
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          const modal = document.getElementById('command-modal');
          if (modal.classList.contains('hidden')) {
            openCommandPalette();
          } else {
            closeCommandPalette();
          }
        }
        // Escape closes any open modal
        if (e.key === 'Escape') {
          closeCommandPalette();
          closeModal('inspect-modal');
          closeModal('transmit-modal');
          closeModal('manifesto-modal');
          closeModal('telemetry-modal');
        }
      });

      // 10. Initialize Lucide Icons
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
