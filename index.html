<html lang="en" class="dark">
<head>

  <title>Astra // Signals from the Void</title>
  <meta name="description" content="Procedural celestial body, fluid particle dynamics, and ambient audio drift.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {

            void: {
              950: '#06070B',
              900: '#0A0D18',
              850: '#0E1222',
              800: '#141A2E',
              700: '#1D2540',
              600: '#2E3859'
            },

            },
            starlight: {

            }

  <!-- Lucide Icons CDN -->

  <!-- Three.js CDN (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap');

    html, body {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none;
    }

    .glass-card {
      background: rgba(14, 18, 34, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-card:hover {
      border-color: rgba(232, 213, 181, 0.25);
      box-shadow: 0 8px 32px 0 rgba(232, 213, 181, 0.08);
    }

    /* Ambient Audio Playing Animation */
    @keyframes eq1 { 0%, 100% { height: 4px; } 50% { height: 14px; } }
    @keyframes eq2 { 0%, 100% { height: 14px; } 50% { height: 6px; } }
    @keyframes eq3 { 0%, 100% { height: 6px; } 50% { height: 12px; } }
    @keyframes eq4 { 0%, 100% { height: 10px; } 50% { height: 4px; } }
    .eq-playing .bar-1 { animation: eq1 1.2s ease-in-out infinite; }
    .eq-playing .bar-2 { animation: eq2 0.9s ease-in-out infinite; }
    .eq-playing .bar-3 { animation: eq3 1.4s ease-in-out infinite; }
    .eq-playing .bar-4 { animation: eq4 1.0s ease-in-out infinite; }

    /* CRT Scanline Filter */
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.22) 50%,
        rgba(0, 0, 0, 0.22)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Radial Vignette */
    .astronomical-vignette {
      background: radial-gradient(circle at center, transparent 45%, rgba(6, 7, 11, 0.88) 100%);
      pointer-events: none;
    }

    /* Film Grain Noise Overlay */
    @keyframes grainShift {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-3%, -3%); }
      20% { transform: translate(2%, 4%); }
      30% { transform: translate(-4%, 2%); }
      40% { transform: translate(3%, -2%); }
      50% { transform: translate(-2%, 3%); }
      60% { transform: translate(4%, 1%); }
      70% { transform: translate(-1%, -4%); }
      80% { transform: translate(3%, 3%); }
      90% { transform: translate(-3%, 1%); }
    }
    .film-grain {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none !important;
      z-index: 25;
      opacity: 0.045;
      animation: grainShift 0.7s steps(4) infinite;
      mix-blend-mode: screen;
    }
  </style>
</head>
<body class="bg-void-950 text-slate-300 font-sans min-h-screen overflow-x-hidden selection:bg-twilight relative">

  <!-- Virtual Scroll Spacer: Preserves page length so native & momentum scrolling drive NOVA morphing -->

  <!-- ========================================== -->
  <!-- JAVASCRIPT: AUDIO, WEBGL & LOGIC           -->
  <!-- ========================================== -->
  <script>
    // ----------------------------------------------------
    // 1. AUDIO SYNTHESIZER: ERIK SATIE / INTERSTELLAR ENGINE
    // ----------------------------------------------------
    class CosmicAudioEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.timer = null;
        this.droneOsc1 = null;
        this.droneOsc2 = null;
        this.droneGain = null;
        this.reverbNode = null;
        this.masterGain = null;

        // C# minor / F# minor poignant notes (Erik Satie / Interstellar mood)
        this.chords = [
          // Voicing 1: C# minor add9
          [138.59, 207.65, 277.18, 311.13, 329.63, 493.88],
          // Voicing 2: A major 7 (#11)
          [110.00, 164.81, 220.00, 277.18, 329.63, 392.00],
          // Voicing 3: F# minor 9
          [92.50, 138.59, 185.00, 220.00, 277.18, 329.63],
          // Voicing 4: G# minor add11
          [103.83, 155.56, 207.65, 246.94, 311.13, 369.99]
        ];
        this.chordIdx = 0;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(0.55, this.ctx.currentTime);

          // Algorithmic 4.5s Cosmic Reverb
          this.reverbNode = this.createCosmicReverb(4.5, 2.2);
          this.masterGain.connect(this.reverbNode);
          this.reverbNode.connect(this.ctx.destination);

          // Dry path for immediate presence
          const dryGain = this.ctx.createGain();
          dryGain.gain.setValueAtTime(0.35, this.ctx.currentTime);
          this.masterGain.connect(dryGain);
          dryGain.connect(this.ctx.destination);
        }
      }

      createCosmicReverb(duration, decay) {
        const sampleRate = this.ctx.sampleRate;
        const length = sampleRate * duration;
        const impulse = this.ctx.createBuffer(2, length, sampleRate);
        const left = impulse.getChannelData(0);
        const right = impulse.getChannelData(1);

        for (let i = 0; i < length; i++) {
          const t = i / sampleRate;
          const env = Math.exp(-t / decay);
          left[i] = (Math.random() * 2 - 1) * env;
          right[i] = (Math.random() * 2 - 1) * env;
        }

        const convolver = this.ctx.createConvolver();
        convolver.buffer = impulse;
        return convolver;
      }

      startDrone() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        this.droneGain = this.ctx.createGain();
        this.droneGain.gain.setValueAtTime(0.001, now);
        this.droneGain.gain.exponentialRampToValueAtTime(0.18, now + 5.0);
        this.droneGain.connect(this.masterGain);

        // Sub-bass root: C#1 (34.65 Hz) & C#2 (69.30 Hz)
        this.droneOsc1 = this.ctx.createOscillator();
        this.droneOsc1.type = 'sine';
        this.droneOsc1.frequency.setValueAtTime(34.65, now);

        this.droneOsc2 = this.ctx.createOscillator();
        this.droneOsc2.type = 'triangle';
        this.droneOsc2.frequency.setValueAtTime(69.30, now);

        // Gentle cosmic lowpass filter
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(140, now);

        this.droneOsc1.connect(filter);
        this.droneOsc2.connect(filter);
        filter.connect(this.droneGain);

        this.droneOsc1.start();
        this.droneOsc2.start();
      }

      stopDrone() {
        if (!this.ctx || !this.droneGain) return;
        const now = this.ctx.currentTime;
        this.droneGain.gain.cancelScheduledValues(now);
        this.droneGain.gain.setValueAtTime(this.droneGain.gain.value, now);
        this.droneGain.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);
        setTimeout(() => {
          if (this.droneOsc1) { this.droneOsc1.stop(); this.droneOsc1.disconnect(); }
          if (this.droneOsc2) { this.droneOsc2.stop(); this.droneOsc2.disconnect(); }
        }, 3100);
      }

      playSatieNote(freq, delaySeconds = 0) {
        if (!this.ctx || !this.isPlaying) return;
        const now = this.ctx.currentTime + delaySeconds;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        // Warm sine / triangle acoustic chime timbre
        osc.type = Math.random() > 0.4 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        // Piano-like envelope: instant attack, long poetic decay
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.12, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.00001, now + 4.8);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 5.0);
      }

      scheduleArpeggio() {
        if (!this.isPlaying) return;
        const chord = this.chords[this.chordIdx];
        this.chordIdx = (this.chordIdx + 1) % this.chords.length;

        // Play 3 to 4 notes from the voicing spaced like contemplative raindrops
        const shuffled = [...chord].sort(() => 0.5 - Math.random());
        const count = Math.floor(Math.random() * 2) + 3;

        for (let i = 0; i < count; i++) {
          const delay = i * (0.45 + Math.random() * 0.35);
          this.playSatieNote(shuffled[i], delay);
        }

        const nextBar = 3800 + Math.random() * 2200;
        this.timer = setTimeout(() => this.scheduleArpeggio(), nextBar);
      }

      playClickChime() {
        this.initContext();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now); // A5 high glass harmonic
        osc.frequency.exponentialRampToValueAtTime(1760, now + 0.05);

        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

        osc.connect(gain);
        gain.connect(this.reverbNode || this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }

      toggle() {
        this.initContext();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        this.isPlaying = !this.isPlaying;
        if (this.isPlaying) {
          this.startDrone();
          this.scheduleArpeggio();
        } else {
          clearTimeout(this.timer);
          this.stopDrone();
        }
        return this.isPlaying;
      }
    }

    let cosmicAudio;

    // ----------------------------------------------------
    // 2. THREE.JS COSMIC SCENE & APPLE-FONT NOVA MORPH
    // ----------------------------------------------------
    let scene, camera, renderer;
    let sandGrain3DGroup, sandGrainMesh, grainInternalLight;
    let galaxyMesh, galaxyCoreMesh, flashMesh, shockwaveMesh, starfieldMesh;
    let starCount = 12500;

    let velocities = new Float32Array(starCount * 3);
    let fluidOffsets = new Float32Array(starCount * 3);
    let burstTurbulence = new Float32Array(starCount * 3);
    let homeRadii = new Float32Array(starCount);
    let homeAngles = new Float32Array(starCount);
    let homeZ = new Float32Array(starCount);

    let introStartTime = 0;
    let hasExploded = false;
    let introComplete = false;
    const rotSpeed = -0.0022; // Synchronized constant anticlockwise galactic spin (preloaded)

    // Apple-Font "NOVA" Constellation Morph Targets & Scroll State
    let novaTargets = null;
    let starDelays = new Float32Array(starCount);
    let targetMorph = 0.0;
    let morphProgress = 0.0;
    let wheelScrollAccumulator = 0.0;

    const mouse2D = new THREE.Vector2(0, 0);
    const cursor3D = new THREE.Vector3(9999, 9999, 0);
    const prevCursor3D = new THREE.Vector3(9999, 9999, 0);
    const raycaster = new THREE.Raycaster();
    const galaxyPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    let isMouseActive = false;
    let isFirstMouseMove = true;

    // Responsive Camera Z based on viewport aspect ratio
    function getResponsiveCamZ() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const aspect = width / height;

      if (aspect < 0.6) {
        return 78.0; // Mobile portrait
      } else if (aspect < 0.85) {
        return 65.0; // Mobile landscape / small tablet
      } else if (aspect < 1.2) {
        return 52.0; // Tablet / square
      } else {
        return 44.0; // Standard widescreen desktop
      }
    }

    // Responsive Apple-Font "NOVA" Target Generator
    function generateNovaTargets(count) {
      const targets = new Float32Array(count * 3);
      const width = window.innerWidth;
      const isMobile = width < 640;
      const isTablet = width >= 640 && width < 1024;

      const W = 1600;
      const H = 400;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 230px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", Arial, sans-serif';

      ctx.letterSpacing = isMobile ? '24px' : '48px';
      ctx.fillText('NOVA', W / 2, H / 2);

      const imgData = ctx.getImageData(0, 0, W, H).data;
      const validPoints = [];
      const step = 2;

      for (let y = 0; y < H; y += step) {
        for (let x = 0; x < W; x += step) {
          const idx = (y * W + x) * 4;
          if (imgData[idx] > 128) {
            validPoints.push({
              x: (x / W - 0.5),
              y: -(y / H - 0.5) * (H / W)
            });
          }
        }
      }

      const letterPointsCount = validPoints.length;
      const novaWorldWidth = isMobile ? 22.0 : (isTablet ? 27.0 : 32.0);
      const letterJitter = isMobile ? 0.16 : 0.22;
      const haloSpread = isMobile ? 15.0 : 20.0;

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        starDelays[i] = (Math.sin(i * 0.043) * 0.5 + 0.5) * 0.45 + (Math.random() * 0.55);

        if (i < count * 0.82 && letterPointsCount > 0) {
          const pt = validPoints[Math.floor(Math.random() * letterPointsCount)];
          targets[i3 + 0] = pt.x * novaWorldWidth + (Math.random() - 0.5) * letterJitter;
          targets[i3 + 1] = pt.y * novaWorldWidth + (Math.random() - 0.5) * letterJitter;
          targets[i3 + 2] = (Math.random() - 0.5) * 0.5;
        } else {
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.random() * haloSpread + 8.0;
          targets[i3 + 0] = Math.cos(angle) * radius;
          targets[i3 + 1] = Math.sin(angle) * (radius * 0.42);
          targets[i3 + 2] = (Math.random() - 0.5) * 4.0;
        }
      }
      return targets;
    }

    // Procedural Sand Grain Textures
    function generateSandTextures() {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#D9B575';
      ctx.fillRect(0, 0, size, size);

      for (let i = 0; i < 60000; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const v = Math.random();
        if (v > 0.85) ctx.fillStyle = '#FFF8E7';
        else if (v > 0.5) ctx.fillStyle = '#C29853';
        else if (v > 0.2) ctx.fillStyle = '#8C6830';
        else ctx.fillStyle = '#3D2D14';
        ctx.fillRect(x, y, 1.5, 1.5);
      }

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = size;
      bumpCanvas.height = size;
      const bCtx = bumpCanvas.getContext('2d');
      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = size;
      roughCanvas.height = size;
      const rCtx = roughCanvas.getContext('2d');
      rCtx.fillStyle = '#999999';
      rCtx.fillRect(0, 0, size, size);

      for (let i = 0; i < 40000; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const b = Math.floor(Math.random() * 255);
        bCtx.fillStyle = `rgb(${b},${b},${b})`;
        bCtx.fillRect(x, y, 2, 2);

        const r = Math.floor(100 + Math.random() * 155);
        rCtx.fillStyle = `rgb(${r},${r},${r})`;
        rCtx.fillRect(x, y, 2, 2);
      }

      return {
        diffuse: new THREE.CanvasTexture(canvas),
        bump: new THREE.CanvasTexture(bumpCanvas),
        roughness: new THREE.CanvasTexture(roughCanvas)
      };
    }

    // 3D Faceted Sand Grain Geometry
    function create3DSandGrain() {
      const group = new THREE.Group();
      const geom = new THREE.IcosahedronGeometry(0.85, 2);
      const pos = geom.attributes.position;
      const v = new THREE.Vector3();

      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        v.x *= 1.25;
        v.y *= 0.82;
        v.z *= 0.65;
        const n = Math.sin(v.x * 4.5) * Math.cos(v.y * 5.2) * Math.sin(v.z * 4.8);
        const disp = 1.0 + n * 0.16 + (Math.random() - 0.5) * 0.08;
        v.multiplyScalar(disp);
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      geom.computeVertexNormals();

      const textures = generateSandTextures();
      const mat = new THREE.MeshStandardMaterial({
        map: textures.diffuse,
        bumpMap: textures.bump,
        bumpScale: 0.045,
        roughnessMap: textures.roughness,
        roughness: 0.68,
        metalness: 0.18,
        color: 0xE8C27A,
        emissive: 0xFFF0D0,
        emissiveIntensity: 0.65,
        flatShading: true
      });

      sandGrainMesh = new THREE.Mesh(geom, mat);
      sandGrainMesh.castShadow = true;
      group.add(sandGrainMesh);

      // Core interior glow light
      grainInternalLight = new THREE.PointLight(0xFFF0D4, 3.2, 14.0);
      group.add(grainInternalLight);

      // Outer micro-particle dust halo
      const haloGeo = new THREE.BufferGeometry();
      const haloCount = 180;
      const haloPos = new Float32Array(haloCount * 3);
      for (let i = 0; i < haloCount; i++) {
        const u = Math.random();
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        const rad = 0.95 + u * 1.4;
        haloPos[i * 3 + 0] = rad * Math.sin(ph) * Math.cos(th);
        haloPos[i * 3 + 1] = rad * Math.sin(ph) * Math.sin(th);
        haloPos[i * 3 + 2] = rad * Math.cos(ph);
      }
      haloGeo.setAttribute('position', new THREE.BufferAttribute(haloPos, 3));

      const haloCanvas = document.createElement('canvas');
      haloCanvas.width = 32;
      haloCanvas.height = 32;
      const hCtx = haloCanvas.getContext('2d');
      const hGrad = hCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
      hGrad.addColorStop(0, 'rgba(255, 240, 212, 1.0)');
      hGrad.addColorStop(0.5, 'rgba(232, 194, 122, 0.45)');
      hGrad.addColorStop(1, 'rgba(232, 194, 122, 0)');
      hCtx.fillStyle = hGrad;
      hCtx.fillRect(0, 0, 32, 32);

      const haloMat = new THREE.PointsMaterial({
        size: 0.18,
        map: new THREE.CanvasTexture(haloCanvas),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.85
      });
      const haloPoints = new THREE.Points(haloGeo, haloMat);
      group.add(haloPoints);

      group.position.set(-18.0, 24.0, -8.0);
      return group;
    }

    function initCosmicScene() {
      const container = document.getElementById('canvas-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      // 1. Scene & Camera Setup
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020205, 0.012);

      const initialCamZ = getResponsiveCamZ();
      camera = new THREE.PerspectiveCamera(52, width / height, 0.1, 1000);
      camera.position.set(8.0, -18.0, 26.0);
      camera.lookAt(-10.0, 14.0, 0.0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x020205, 1.0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      container.appendChild(renderer.domElement);

      // 2. Cinematic Lighting
      const keyLight = new THREE.DirectionalLight(0xFFF4D4, 2.4);
      keyLight.position.set(-12, 20, 15);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0x7890C0, 1.6);
      rimLight.position.set(16, -10, -8);
      scene.add(rimLight);

      const ambientLight = new THREE.AmbientLight(0x0A0D18, 0.85);
      scene.add(ambientLight);

      // 3. Create and add 3D Sand Grain
      sandGrain3DGroup = create3DSandGrain();
      scene.add(sandGrain3DGroup);

      // 4. Preload Apple-Font "NOVA" targets
      novaTargets = generateNovaTargets(starCount);

      // 5. Generate 12,500 Star Logarithmic Spiral Nebula
      const positions = new Float32Array(starCount * 3);
      const colors = new Float32Array(starCount * 3);
      const sizes = new Float32Array(starCount);

      const colCore = new THREE.Color(0xFFFFFF);
      const colGold = new THREE.Color(0xE8D5B5);
      const colCyan = new THREE.Color(0x8A82A5);
      const colDeep = new THREE.Color(0x3B3561);

      const arms = 3;
      const armSpread = 0.38;

      for (let i = 0; i < starCount; i++) {
        const i3 = i * 3;
        const norm = Math.pow(Math.random(), 2.1);
        const radius = norm * 26.0 + 0.2;
        const armOffset = (i % arms) * ((Math.PI * 2) / arms);
        const spinAngle = radius * 0.72;
        const spread = (Math.random() - 0.5) * armSpread * (radius * 0.45 + 0.3);
        const angle = armOffset + spinAngle + spread;

        homeRadii[i] = radius;
        homeAngles[i] = angle;
        homeZ[i] = (Math.random() - 0.5) * (3.8 * Math.exp(-radius * 0.12));

        positions[i3 + 0] = 0;
        positions[i3 + 1] = 0;
        positions[i3 + 2] = 0;

        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2.0 * Math.random() - 1.0);
        const speed = 4.0 + Math.random() * 8.0;
        burstTurbulence[i3 + 0] = Math.sin(ph) * Math.cos(th) * speed;
        burstTurbulence[i3 + 1] = Math.sin(ph) * Math.sin(th) * speed;
        burstTurbulence[i3 + 2] = Math.cos(ph) * speed * 0.5;

        let starColor;
        const rNorm = radius / 26.0;
        if (rNorm < 0.12) {
          starColor = colCore.clone().lerp(colGold, rNorm / 0.12);
          sizes[i] = 2.4 + Math.random() * 1.8;
        } else if (rNorm < 0.45) {
          starColor = colGold.clone().lerp(colCyan, (rNorm - 0.12) / 0.33);
          sizes[i] = 1.6 + Math.random() * 1.4;
        } else {
          starColor = colCyan.clone().lerp(colDeep, (rNorm - 0.45) / 0.55);
          sizes[i] = 1.0 + Math.random() * 1.0;
        }

        colors[i3 + 0] = starColor.r;
        colors[i3 + 1] = starColor.g;
        colors[i3 + 2] = starColor.b;
      }

      const galaxyGeo = new THREE.BufferGeometry();
      galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      galaxyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      galaxyGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

      // Crisp circular gaussian particle shader with brightness boost on morph
      const galaxyMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uMorph: { value: 0 }
        },
        vertexShader: `
          attribute float size;
          attribute vec3 color;
          varying vec3 vColor;
          varying float vDist;
          uniform float uMorph;
          void main() {
            vColor = color;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vDist = length(mvPosition.xyz);
            float baseSize = size * (220.0 / -mvPosition.z);
            gl_PointSize = baseSize * (1.0 + uMorph * 0.35);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          uniform float uMorph;
          void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;
            float strength = pow(1.0 - (dist * 2.0), 2.2);
            vec3 finalColor = vColor * (1.0 + uMorph * 0.4);
            gl_FragColor = vec4(finalColor, strength);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      galaxyMesh = new THREE.Points(galaxyGeo, galaxyMat);
      galaxyMesh.visible = false;
      scene.add(galaxyMesh);

      // 6. Supernova Core & Shockwave Elements
      const coreCanvas = document.createElement('canvas');
      coreCanvas.width = 128;
      coreCanvas.height = 128;
      const cCtx = coreCanvas.getContext('2d');
      const cGrad = cCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
      cGrad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
      cGrad.addColorStop(0.18, 'rgba(255, 240, 212, 0.9)');
      cGrad.addColorStop(0.45, 'rgba(232, 213, 181, 0.4)');
      cGrad.addColorStop(0.8, 'rgba(138, 130, 165, 0.15)');
      cGrad.addColorStop(1, 'rgba(6, 7, 11, 0)');
      cCtx.fillStyle = cGrad;
      cCtx.fillRect(0, 0, 128, 128);

      const coreMat = new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(coreCanvas),
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
      });
      galaxyCoreMesh = new THREE.Sprite(coreMat);
      galaxyCoreMesh.scale.set(4.8, 4.8, 1);
      galaxyCoreMesh.visible = false;
      scene.add(galaxyCoreMesh);

      // Flash Mesh for explosion detonation
      const flashCanvas = document.createElement('canvas');
      flashCanvas.width = 64;
      flashCanvas.height = 64;
      const fCtx = flashCanvas.getContext('2d');
      const fGrad = fCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
      fGrad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
      fGrad.addColorStop(0.3, 'rgba(255, 245, 220, 0.8)');
      fGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      fCtx.fillStyle = fGrad;
      fCtx.fillRect(0, 0, 64, 64);

      flashMesh = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(flashCanvas),
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false,
        opacity: 0
      }));
      flashMesh.scale.set(0.1, 0.1, 1);
      scene.add(flashMesh);

      // Supersonic Shockwave Ring
      const ringCanvas = document.createElement('canvas');
      ringCanvas.width = 128;
      ringCanvas.height = 128;
      const rCtx = ringCanvas.getContext('2d');
      rCtx.beginPath();
      rCtx.arc(64, 64, 52, 0, Math.PI * 2);
      rCtx.lineWidth = 6;
      rCtx.strokeStyle = 'rgba(255, 240, 212, 0.95)';
      rCtx.stroke();
      rCtx.beginPath();
      rCtx.arc(64, 64, 52, 0, Math.PI * 2);
      rCtx.lineWidth = 18;
      rCtx.strokeStyle = 'rgba(232, 194, 122, 0.35)';
      rCtx.stroke();

      shockwaveMesh = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(ringCanvas),
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false,
        opacity: 0
      }));
      shockwaveMesh.scale.set(0.1, 0.1, 1);
      scene.add(shockwaveMesh);

      // Deep Field Infinite Ambient Background Stars
      const bgGeo = new THREE.BufferGeometry();
      const bgCount = 2800;
      const bgPos = new Float32Array(bgCount * 3);
      for (let i = 0; i < bgCount; i++) {
        bgPos[i * 3 + 0] = (Math.random() - 0.5) * 450;
        bgPos[i * 3 + 1] = (Math.random() - 0.5) * 450;
        bgPos[i * 3 + 2] = -50 - Math.random() * 200;
      }
      bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
      const bgMat = new THREE.PointsMaterial({
        size: 1.1,
        color: 0x6E7899,
        transparent: true,
        opacity: 0.65,
        depthWrite: false
      });
      starfieldMesh = new THREE.Points(bgGeo, bgMat);
      scene.add(starfieldMesh);

      // Event Listeners for fluid cursor interaction & responsive layout
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('touchstart', onTouchStart, { passive: true });
      window.addEventListener('touchmove', onTouchMove, { passive: true });
      window.addEventListener('touchend', onTouchEnd, { passive: true });

      animate();
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);

      // Re-generate responsive NOVA targets for new aspect ratio / device orientation
      if (starCount && typeof generateNovaTargets === 'function') {
        novaTargets = generateNovaTargets(starCount);
      }
    }

    function onMouseMove(e) {
      isMouseActive = true;
      mouse2D.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse2D.y = -(e.clientY / window.innerHeight) * 2 + 1;
    }

    let touchStartY = 0;
    function onTouchStart(e) {
      if (e.touches.length > 0) {
        touchStartY = e.touches[0].clientY;
        isMouseActive = true;
        mouse2D.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        mouse2D.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
      }
    }

    function onTouchMove(e) {
      if (e.touches.length > 0) {
        isMouseActive = true;
        mouse2D.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        mouse2D.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;

        // Mobile touch swipe gestures smoothly drive page scroll & NOVA morphing
        if (introComplete) {
          const deltaY = touchStartY - e.touches[0].clientY;
          touchStartY = e.touches[0].clientY;
          const maxScroll = Math.max(window.innerHeight * 0.85, 420.0);
          const currentScroll = window.scrollY || window.pageYOffset || 0;
          const newScroll = THREE.MathUtils.clamp(currentScroll + deltaY * 1.5, 0, maxScroll);
          window.scrollTo({ top: newScroll, behavior: 'auto' });
          updateScrollMorph();
        }
      }
    }

    function onTouchEnd() {
      isMouseActive = false;
    }

    // Main 60fps render loop with Cinematic Intro & Fluid Dynamics
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      if (introStartTime === 0) introStartTime = elapsedTime;
      const introT = elapsedTime - introStartTime;
      const targetCamZ = getResponsiveCamZ();

      // ----------------------------------------------------
      // CINEMATIC TIMELINE:
      // 0.0s - 1.5s: 3D Faceted Sand Grain falls tumbling from top-left, camera swoops from bottom
      // 1.5s - 1.9s: 3D Grain halts at center, charges & shakes with blinding power
      // 1.9s - 3.4s: SUPERNOVA DETONATION: supersonic burst expanding into logarithmic nebula!
      // 3.4s+: Interactive Fluid Galaxy & Scroll-driven NOVA Constellation
      // ----------------------------------------------------

      if (introT < 1.5) {
        // --- PHASE 1: 3D TUMBLING GRAIN FALLS FROM TOP-LEFT ---
        const p = Math.min(Math.max(introT / 1.5, 0.0), 1.0);
        const ease = p * p * (3.0 - 2.0 * p); // smooth cubic Hermite

        sandGrain3DGroup.position.x = THREE.MathUtils.lerp(-18.0, 0.0, ease);
        sandGrain3DGroup.position.y = THREE.MathUtils.lerp(24.0, 0.0, ease);
        sandGrain3DGroup.position.z = THREE.MathUtils.lerp(-8.0, 0.0, ease);

        if (sandGrainMesh) {
          sandGrainMesh.rotation.x += 0.038;
          sandGrainMesh.rotation.y += 0.052;
          sandGrainMesh.rotation.z += 0.025;
        }

        camera.position.x = THREE.MathUtils.lerp(8.0, 0.0, ease);
        camera.position.y = THREE.MathUtils.lerp(-18.0, 0.0, ease);
        camera.position.z = THREE.MathUtils.lerp(26.0, targetCamZ, ease);

        const lookX = THREE.MathUtils.lerp(-10.0, 0.0, ease);
        const lookY = THREE.MathUtils.lerp(14.0, 0.0, ease);
        camera.lookAt(lookX, lookY, 0.0);

        renderer.render(scene, camera);
        return;

      } else if (introT < 1.9) {
        // --- PHASE 2: 3D GRAIN PAUSES AT CENTER & CHARGES ---
        camera.position.set(0, 0, targetCamZ);
        camera.lookAt(0, 0, 0);

        const chargeP = (introT - 1.5) / 0.4;
        const swell = 1.0 + chargeP * 2.2;
        sandGrain3DGroup.scale.set(swell, swell, swell);

        if (sandGrainMesh) {
          sandGrainMesh.rotation.x += 0.09;
          sandGrainMesh.rotation.y += 0.12;
          sandGrainMesh.rotation.z += 0.06;
          sandGrainMesh.material.emissiveIntensity = 0.65 + chargeP * 5.0;
        }

        if (grainInternalLight) {
          grainInternalLight.intensity = 3.2 + chargeP * 12.0;
        }

        sandGrain3DGroup.position.set(
          (Math.random() - 0.5) * 0.22,
          (Math.random() - 0.5) * 0.22,
          0.0
        );

        renderer.render(scene, camera);
        return;

      } else if (introT < 3.4) {
        // --- PHASE 3: SUPERSONIC SUPERNOVA EXPLOSION INTO NEBULA (1.9s to 3.4s) ---
        if (!hasExploded) {
          hasExploded = true;
          sandGrain3DGroup.visible = false; // 3D grain shatters into 12,500 stars!
          galaxyMesh.visible = true;
          galaxyCoreMesh.visible = true;
          galaxyCoreMesh.scale.set(0.1, 0.1, 1);
        }

        camera.position.set(0, 0, targetCamZ);
        camera.lookAt(0, 0, 0);

        const explodeP = (introT - 1.9) / 1.5;
        const ease = 1.0 - Math.pow(1.0 - explodeP, 4.0);

        // 1. Detonation Flash
        if (explodeP < 0.3) {
          const flashP = explodeP / 0.3;
          flashMesh.scale.set(18.0 * flashP, 18.0 * flashP, 1);
          flashMesh.material.opacity = (1.0 - flashP) * 1.0;
        } else if (flashMesh.material.opacity > 0) {
          flashMesh.material.opacity = 0;
        }

        // 2. Shockwave Expansion
        if (explodeP < 0.6) {
          const swP = explodeP / 0.6;
          shockwaveMesh.scale.set(45.0 * swP, 45.0 * swP, 1);
          shockwaveMesh.material.opacity = (1.0 - swP) * 0.95;
        } else if (shockwaveMesh.material.opacity > 0) {
          shockwaveMesh.material.opacity = 0;
        }

        // 3. 12,500 Star Explosive Expansion directly into Logarithmic Spiral Arms
        const posAttr = galaxyMesh.geometry.attributes.position;
        const posArr = posAttr.array;

        const unwindAngle = (1.0 - ease) * 1.35;
        const turbDecay = (1.0 - ease) * 2.5;

        for (let i = 0; i < starCount; i++) {
          homeAngles[i] += rotSpeed; // Continuous spin preloaded and active from the moment it unravels!
          const i3 = i * 3;
          const r = homeRadii[i] * ease;
          const theta = homeAngles[i] + unwindAngle;

          const px = Math.cos(theta) * r + burstTurbulence[i3 + 0] * turbDecay;
          const py = Math.sin(theta) * r + burstTurbulence[i3 + 1] * turbDecay;
          const pz = homeZ[i] * ease + burstTurbulence[i3 + 2] * turbDecay;

          posArr[i3 + 0] = px;
          posArr[i3 + 1] = py;
          posArr[i3 + 2] = pz;
        }
        posAttr.needsUpdate = true;

        if (galaxyCoreMesh) {
          const coreScale = 4.8 * ease;
          galaxyCoreMesh.scale.set(coreScale, coreScale, 1);
        }

        if (galaxyMesh.material.uniforms) {
          galaxyMesh.material.uniforms.uTime.value = elapsedTime;
          if (galaxyMesh.material.uniforms.uMorph) {
            galaxyMesh.material.uniforms.uMorph.value = 0.0;
          }
        }

        renderer.render(scene, camera);
        return;
      }

      // --- PHASE 4: INTERACTIVE FLUID GALAXY (introComplete = true) ---
      if (!introComplete) {
        introComplete = true;
        for (let i = 0; i < starCount * 3; i++) {
          velocities[i] = 0;
          fluidOffsets[i] = 0;
        }
      }

      // 1. Raycast cursor coordinates onto galaxy plane (z = 0)
      if (isMouseActive) {
        raycaster.setFromCamera(mouse2D, camera);
        const intersection = new THREE.Vector3();
        const hasIntersect = raycaster.ray.intersectPlane(galaxyPlane, intersection);
        if (hasIntersect) {
          cursor3D.copy(intersection);
          if (isFirstMouseMove) {
            prevCursor3D.copy(cursor3D);
            isFirstMouseMove = false;
          }
        }
      } else {
        cursor3D.set(9999, 9999, 0);
        prevCursor3D.set(9999, 9999, 0);
      }

      const cursorVx = isMouseActive ? cursor3D.x - prevCursor3D.x : 0;
      const cursorVy = isMouseActive ? cursor3D.y - prevCursor3D.y : 0;
      const cursorSpeed = Math.hypot(cursorVx, cursorVy);
      if (isMouseActive) prevCursor3D.copy(cursor3D);

      // 2. Laminar Fluid Physics & Seamless Constant Galactic Spin
      const radius = 3.4;
      const radiusSq = radius * radius;
      const posAttr = galaxyMesh.geometry.attributes.position;
      const posArr = posAttr.array;

      // Smoothly ease morphProgress toward targetMorph (0.0 = spiral galaxy, 1.0 = assembled NOVA)
      morphProgress += (targetMorph - morphProgress) * 0.065;

      // Reveal makeshift nav bar ONLY when user scrolls to completed NOVA text
      const makeshiftNav = document.getElementById('makeshift-nav');
      if (makeshiftNav && introComplete) {
        if (morphProgress >= 0.88) {
          if (makeshiftNav.classList.contains('opacity-0')) {
            makeshiftNav.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
            makeshiftNav.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
          }
        } else {
          if (!makeshiftNav.classList.contains('opacity-0')) {
            makeshiftNav.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
            makeshiftNav.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
          }
        }
      }

      const stickDirX = cursorSpeed > 0.0001 ? cursorVx / cursorSpeed : 0;
      const stickDirY = cursorSpeed > 0.0001 ? cursorVy / cursorSpeed : 0;
      const perpX = -stickDirY;
      const perpY = stickDirX;

      const isMorphing = morphProgress > 0.0005 && novaTargets;

      for (let i = 0; i < starCount; i++) {
        const i3 = i * 3;
        homeAngles[i] += rotSpeed; // Constant steady spin continues with zero lag!
        const hx = homeRadii[i] * Math.cos(homeAngles[i]);
        const hy = homeRadii[i] * Math.sin(homeAngles[i]);
        const hz = homeZ[i];

        let finalX = hx;
        let finalY = hy;
        let finalZ = hz;

        if (isMorphing) {
          const delay = starDelays[i];
          const rawP = THREE.MathUtils.clamp((morphProgress - delay * 0.35) / 0.65, 0.0, 1.0);
          const p = rawP * rawP * (3.0 - 2.0 * rawP);

          const nx = novaTargets[i3 + 0];
          const ny = novaTargets[i3 + 1];
          const nz = novaTargets[i3 + 2];

          // Graceful celestial inward swirl arc
          const swirlArc = p * (1.0 - p) * 1.5;
          const swirlX = -hy * swirlArc * 0.20;
          const swirlY = hx * swirlArc * 0.20;

          finalX = THREE.MathUtils.lerp(hx, nx, p) + swirlX;
          finalY = THREE.MathUtils.lerp(hy, ny, p) + swirlY;
          finalZ = THREE.MathUtils.lerp(hz, nz, p);
        }

        let px = finalX + fluidOffsets[i3 + 0];
        let py = finalY + fluidOffsets[i3 + 1];

        const dx = px - cursor3D.x;
        const dy = py - cursor3D.y;

        if (Math.abs(dx) < radius && Math.abs(dy) < radius) {
          const distSq = dx * dx + dy * dy;
          if (distSq < radiusSq) {
            const dist = Math.sqrt(distSq) + 0.001;
            const t = 1.0 - dist / radius;
            const factor = t * t * (3.0 - 2.0 * t);

            const side = dx * perpX + dy * perpY;
            const sideSign = side >= 0 ? 1.0 : -1.0;

            const lateralMag = factor * 0.026 * Math.min(cursorSpeed * 0.22 + 0.35, 0.85);
            const radialMag = factor * factor * 0.016;

            velocities[i3 + 0] += perpX * sideSign * lateralMag + (dx / dist) * radialMag;
            velocities[i3 + 1] += perpY * sideSign * lateralMag + (dy / dist) * radialMag;
            velocities[i3 + 2] += (Math.random() - 0.5) * factor * 0.010;
          }
        }

        // Fluid displacement restoring spring & damping
        velocities[i3 + 0] = (velocities[i3 + 0] - fluidOffsets[i3 + 0] * 0.06) * 0.88;
        velocities[i3 + 1] = (velocities[i3 + 1] - fluidOffsets[i3 + 1] * 0.06) * 0.88;
        velocities[i3 + 2] = (velocities[i3 + 2] - fluidOffsets[i3 + 2] * 0.06) * 0.88;

        fluidOffsets[i3 + 0] += velocities[i3 + 0];
        fluidOffsets[i3 + 1] += velocities[i3 + 1];
        fluidOffsets[i3 + 2] += velocities[i3 + 2];

        posArr[i3 + 0] = finalX + fluidOffsets[i3 + 0];
        posArr[i3 + 1] = finalY + fluidOffsets[i3 + 1];
        posArr[i3 + 2] = finalZ + fluidOffsets[i3 + 2];
      }

      posAttr.needsUpdate = true;

      if (galaxyMesh.material.uniforms) {
        galaxyMesh.material.uniforms.uTime.value = elapsedTime;
        if (galaxyMesh.material.uniforms.uMorph) {
          galaxyMesh.material.uniforms.uMorph.value = morphProgress;
        }
      }

      // Smooth camera micro-drift
      if (isMouseActive) {
        const targetCamX = THREE.MathUtils.clamp(mouse2D.x * 2.2, -2.5, 2.5);
        const targetCamY = THREE.MathUtils.clamp(mouse2D.y * 1.6, -2.0, 2.0);
        camera.position.x += (targetCamX - camera.position.x) * 0.03;
        camera.position.y += (targetCamY - camera.position.y) * 0.03;
      } else {
        camera.position.x += (0.0 - camera.position.x) * 0.03;
        camera.position.y += (0.0 - camera.position.y) * 0.03;
      }
      camera.position.z += (targetCamZ - camera.position.z) * 0.08;
      camera.lookAt(0, 0, 0);

      // Core pulse - softens and dims when NOVA is assembled so letters stand out brilliantly
      if (galaxyCoreMesh) {
        const pulse = 1.0 + 0.08 * Math.sin(elapsedTime * 2.5);
        const coreScale = 4.8 * pulse * (1.0 - morphProgress * 0.65);
        galaxyCoreMesh.scale.set(coreScale, coreScale, 1);
        galaxyCoreMesh.material.opacity = 0.85 * (1.0 - morphProgress * 0.50);
      }

      renderer.render(scene, camera);
    }

    // Replays the 3D sand grain fall and supernova explosion intro seamlessly
    function replayIntroAnimation() {
      introStartTime = clock.getElapsedTime();
      hasExploded = false;
      introComplete = false;
      isFirstMouseMove = true;

      targetMorph = 0.0;
      morphProgress = 0.0;
      wheelScrollAccumulator = 0.0;

      // Reset window scroll & hide makeshift navbar
      window.scrollTo({ top: 0, behavior: 'auto' });
      const makeshiftNav = document.getElementById('makeshift-nav');
      if (makeshiftNav) {
        makeshiftNav.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
        makeshiftNav.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }

      // Reset camera to initial low angle looking up at top-left
      camera.position.set(8.0, -18.0, 26.0);
      camera.lookAt(-10.0, 14.0, 0.0);

      // Re-enable and reset 3D sand grain
      if (sandGrain3DGroup) {
        sandGrain3DGroup.position.set(-18.0, 24.0, -8.0);
        sandGrain3DGroup.scale.set(1.0, 1.0, 1.0);
        sandGrain3DGroup.visible = true;
      }
      if (sandGrainMesh) {
        sandGrainMesh.material.emissiveIntensity = 0.65;
      }
      if (grainInternalLight) {
        grainInternalLight.intensity = 3.2;
      }

      // Hide galaxy and flash elements until explosion at 1.9s
      if (galaxyMesh) galaxyMesh.visible = false;
      if (galaxyCoreMesh) galaxyCoreMesh.visible = false;
      if (flashMesh) {
        flashMesh.material.opacity = 0;
        flashMesh.scale.set(0.1, 0.1, 1);
      }
      if (shockwaveMesh) {
        shockwaveMesh.material.opacity = 0;
        shockwaveMesh.scale.set(0.1, 0.1, 1);
      }
    }

    // ----------------------------------------------------
    // 3. SCROLL & GESTURE DRIVEN NOVA MORPHING ENGINE
    // ----------------------------------------------------
    function updateScrollMorph() {
      if (!introComplete) return;
      const pageScrollY = window.scrollY || window.pageYOffset || 0;
      const maxScroll = Math.max(window.innerHeight * 0.85, 420.0);
      const scrollProgress = THREE.MathUtils.clamp(pageScrollY / maxScroll, 0.0, 1.0);
      wheelScrollAccumulator = scrollProgress;
      targetMorph = scrollProgress;
    }

    function onWheelScroll(e) {
      if (!introComplete) return;
      const maxScroll = Math.max(window.innerHeight * 0.85, 420.0);
      const currentScroll = window.scrollY || window.pageYOffset || 0;
      const newScroll = THREE.MathUtils.clamp(currentScroll + e.deltaY, 0, maxScroll);
      window.scrollTo({ top: newScroll, behavior: 'auto' });
      updateScrollMorph();
    }

    // ----------------------------------------------------
    // 4. APPLICATION INITIALIZATION & EVENT BINDINGS
    // ----------------------------------------------------
    function initApp() {
      // 1. Initialize Cosmic Three.js Scene
      initCosmicScene();

      // 2. Initialize Generative Audio Engine
      cosmicAudio = new CosmicAudioEngine();

      // 3. Scroll & Wheel listeners: Native scroll drives NOVA morphing across preserved page length
      window.addEventListener('scroll', updateScrollMorph, { passive: true });
      window.addEventListener('wheel', onWheelScroll, { passive: true });

      // 4. Top-Left 3-Line Hamburger Menu: Smooth return to nebula & scroll to top
      const hamburgerBtn = document.getElementById('nav-hamburger-btn');
      if (hamburgerBtn) {
        hamburgerBtn.addEventListener('click', () => {
          if (cosmicAudio && cosmicAudio.playClickChime) cosmicAudio.playClickChime();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          targetMorph = 0.0;
          wheelScrollAccumulator = 0.0;
        });
      }

      // 5. Top-Right Crescent Moon: Toggle ambient drift audio with starlight glow
      const moonBtn = document.getElementById('nav-moon-btn');
      if (moonBtn) {
        moonBtn.addEventListener('click', () => {
          if (cosmicAudio) {
            const isPlaying = cosmicAudio.toggle();
            if (isPlaying) {
              moonBtn.classList.add('border-starlight/60', 'bg-starlight/20', 'text-white', 'shadow-[0_0_15px_rgba(232,213,181,0.25)]');
            } else {
              moonBtn.classList.remove('border-starlight/60', 'bg-starlight/20', 'text-white', 'shadow-[0_0_15px_rgba(232,213,181,0.25)]');
            }
          }
        });
      }

      // 6. Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        // Space or M key toggles audio via moon button
        if (e.code === 'Space' || e.key === 'm' || e.key === 'M') {
          e.preventDefault();
          if (moonBtn) moonBtn.click();
        }
        // R key replays the 3D sand grain fall & supernova intro
        if (e.key === 'r' || e.key === 'R') {
          replayIntroAnimation();
        }
      });

      // 7. Initialize Lucide Icons
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
